# Formatting, validation and policy for infra/ on every change that touches it.
#
# docs/workstreams/11-infra-opentofu.md §7. The jobs that need no credentials
# always run; the staging plan runs only where Azure credentials exist, because
# a plan needs to read state and talk to the provider. A plan creates nothing,
# and staging's host list is empty, so it costs nothing either.

name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

jobs:
  check:
    name: fmt, validate, policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.6"

      - name: tofu fmt
        run: make -C infra fmt-check

      # -backend=false: no credentials, no state, no network beyond the
      # provider registry. The committed .terraform.lock.hcl is what makes
      # this resolve the same versions a laptop resolves (DECISIONS I-22).
      - name: tofu validate
        run: make -C infra validate

      # Pinned and fetched from the release asset directly: the upstream
      # install script resolves "latest" through api.github.com, which an
      # unauthenticated runner gets rate-limited on (main 4bcc94b, curl 22).
      - name: install tfsec
        env:
          TFSEC_VERSION: v1.28.14
        run: |
          for i in 1 2 3; do
            curl -fsSL "https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64" -o /usr/local/bin/tfsec && break
            sleep 15
          done
          chmod +x /usr/local/bin/tfsec && tfsec --version

      # REPOSE-NET-001 is the one that matters: an inbound rule on the hosts
      # subnet fails the build (docs/DESIGN.md §4, §7).
      - name: tfsec
        run: make -C infra policy

  plan:
    name: staging plan
    runs-on: ubuntu-latest
    needs: check
    # Azure credentials are federated to this repository's OIDC identity; where
    # they are absent the job is skipped rather than failing the build.
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    # Only this job exchanges an OIDC token for Azure credentials.
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.6"

      - name: tofu plan
        run: make -C infra plan ENV=staging
