# hostd on a Mac (design 2, DECISIONS I-1662): the darwin substrate's Go
# tests, which no Linux job can run (launchd, APFS, VZ save, the userspace
# network all build with GOOS=darwin only), and the VM launcher, which only
# a Mac's swiftc builds. On every push that touches them, so a queued
# branch runs it before its pull request, and by hand (DECISIONS I-1688).

name: darwin

on:
  push:
    paths:
      - "cmd/hostd/**"
      - "cmd/repose-vm/**"
      - "internal/hostd/**"
      - "internal/parkkey/**"
      - "internal/cli/**"
      - "cmd/repose/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/darwin.yml"
  workflow_dispatch:

permissions:
  contents: read

# macOS's own TMPDIR (/var/folders/...) leaves too little of a unix socket
# path's 104 bytes for the tests' sockets under t.TempDir(); /tmp is a link
# to /private/tmp, and tests that compare a resolved path need the real one.
env:
  TMPDIR: /private/tmp

jobs:
  hostd:
    name: darwin hostd tests and the VM launcher
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: the launcher builds, signed with the virtualization entitlement
        run: |
          sh cmd/repose-vm/build.sh "$RUNNER_TEMP/repose-vm"
          codesign -d --entitlements - "$RUNNER_TEMP/repose-vm" 2>&1 | grep -q com.apple.security.virtualization
      - run: go build ./cmd/hostd ./cmd/repose
      - run: go vet ./internal/hostd/... ./cmd/hostd ./internal/parkkey/...
      # TEMP d2-int-3: the tag-push flake, many times.
      - run: go test -race -count=100 -run 'TestVZKilledLauncherBootsAgain|TestBootDialFindsGuestdSoon' ./internal/hostd/guest
      - name: go test -race, every darwin hostd package but the network
        if: ${{ !cancelled() }}
        run: |
          go list ./internal/hostd/... | grep -v '/unet$' > "$RUNNER_TEMP/pkgs"
          xargs go test -race -p 2 -timeout 30m ./cmd/hostd ./internal/parkkey/... < "$RUNNER_TEMP/pkgs"
      # The userspace network without -race: on this 3-core runner the race
      # detector under gVisor and wireguard-go missed four different timing
      # bounds across five runs (UDP reply, flow rate, SMTP counter, edge
      # wake), each green without it. Its race coverage is ci.yml's Linux
      # run, where the same package passes under -race.
      - name: go test internal/hostd/unet
        if: ${{ !cancelled() }}
        run: go test -count=1 -timeout 15m ./internal/hostd/unet
      # The CLI as a Mac user runs it: its laptop side (host add, rm and
      # restart on a Mac, the installer and updater, login and the Keychain,
      # config, ssh certificates, versions, the docs guard). The rest of
      # internal/cli's tests drive a stub machine that runs the guest's half
      # of each command on this host, which here is macOS (BSD touch and
      # stat, no ss): no customer's guest is, and ci.yml runs them on Linux
      # (48 of them fail here for that alone, run 45948757737).
      # A few of them seed the stub machine's tmux session.
      - run: brew install tmux
        if: ${{ !cancelled() }}
      - name: go test internal/cli, the laptop side
        if: ${{ !cancelled() }}
        run: |
          files="appliance cert certrefusal config configerofs configmenu devx_errors docs exitcode_login host_add_json hostrestart hosts login machost repoconfig version versionupdate"
          tests=$(for f in $files; do grep -hoE '^func Test[A-Za-z0-9_]+' "internal/cli/${f}_test.go"; done | awk '{print $2}' | paste -sd'|' -)
          echo "$(echo "$tests" | tr '|' '\n' | wc -l) tests"
          go test -p 2 -timeout 20m -run "^($tests)\$" ./internal/cli ./cmd/repose
      # An exact version, as ci.yml's lint (DECISIONS I-429).
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
        if: ${{ !cancelled() }}
      - run: golangci-lint run ./internal/hostd/... ./cmd/hostd ./internal/parkkey/... ./internal/cli/... ./cmd/repose
        if: ${{ !cancelled() }}
