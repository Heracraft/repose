# Tier-1 pull-request and main-push CI (DECISIONS I-1456).
# `fast-checks` runs unconditionally on every pull request and push to main
# (~15s, no Nix install). `changes` classifies the diff with pure bash and
# `git diff --name-only` (every gate opens on a push to main or an edit to
# .github/workflows/). The full CLI packaging matrix and the 18.6-minute
# Lighthouse accessibility audit run in ci-heavy.yml on main pushes, nightly
# schedule, workflow_dispatch, and PRs touching install.sh or .goreleaser.yaml.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      proto: ${{ steps.filter.outputs.proto }}
      web: ${{ steps.filter.outputs.web }}
      nix: ${{ steps.filter.outputs.nix }}
      nix_overlay: ${{ steps.filter.outputs.nix_overlay }}
      ops: ${{ steps.filter.outputs.ops }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - id: filter
        name: classify changed paths
        run: |
          go=false
          proto=false
          web=false
          nix=false
          nix_overlay=false
          ops=false
          all=false

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            all=true
          else
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)
            if [ -z "$files" ] || grep -qE '^\.github/workflows/' <<<"$files"; then
              all=true
            fi
          fi

          if [ "$all" = true ]; then
            go=true; proto=true; web=true; nix=true; nix_overlay=true; ops=true
          else
            grep -qE '^(go\.(mod|sum)$|cmd/|internal/|test/|proto/|\.golangci\.yml$)' <<<"$files" && go=true
            grep -qE '^(proto/|buf\.)' <<<"$files" && proto=true
            grep -qE '^(apps/web/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|install\.sh$|internal/fakes/api/|cmd/fakeapi/|cmd/fake-logto/|test/fake-logto/)' <<<"$files" && web=true
            grep -qE '^(nix/|go\.(mod|sum)$|cmd/|internal/|docs/features/config-examples/)' <<<"$files" && nix=true
            grep -qE '^nix/(overlay/|flake\.(nix|lock)$)' <<<"$files" && nix_overlay=true
            grep -qE '^ops/' <<<"$files" && ops=true
          fi

          for k in go proto web nix nix_overlay ops; do
            echo "$k=${!k}"
            echo "$k=${!k}" >> "$GITHUB_OUTPUT"
          done

  fast-checks:
    name: fast checks (decisions, supplychain, domain, cli docs, darwin build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: the decisions index is current and no id is cited without an entry
        run: python3 ops/dev/decisions-index.py --check
      - name: the docs-ahead-of-cli reader still finds a command path
        if: ${{ !cancelled() }}
        run: python3 ops/dev/docs-ahead-of-cli --selftest
      - name: cross-compile cli for darwin (arm64, amd64)
        if: ${{ !cancelled() }}
        run: |
          GOOS=darwin GOARCH=arm64 go build ./cmd/repose
          GOOS=darwin GOARCH=amd64 go build ./cmd/repose
      - name: domain, supplychain, dev harnesses, and cli docs/copy guards
        if: ${{ !cancelled() }}
        run: go test ./test/domain/... ./test/supplychain/... ./internal/cli -run 'TestDocs|TestEvery|TestSuccessOutputNamesNoCommand|TestCLIReassures|AgentGuide'

  go:
    name: go build, vet, test, lint
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The api's integration tests run against a real Postgres
    # (docs/workstreams/05-control-plane-api.md §7).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # internal/guestd's strace tests skip when strace is absent, and a
      # skip reads as a pass. Nothing installed it here, so whether that
      # guard had ever run in CI was not knowable from the outside; the
      # test now fails rather than skips when CI is set, and this makes
      # sure it has no reason to (DECISIONS I-1036).
      - run: sudo apt-get update && sudo apt-get install -y strace
      # internal/cli's attach tests drive a real tmux as the fake guest's
      # (internal/testguest), and since I-1067 an attach is a session
      # grouped with the project's that is destroyed on detach. tmux 3.4,
      # which is all ubuntu-24.04 has, segfaults in that destruction when
      # the machine is busy, taking the project's session with it: two of
      # the runs on main a9056ba7 died that way. Guests run nixpkgs' tmux,
      # so the crash is this runner's and not what repose ships; the
      # release here is the one nix/guest has (DECISIONS I-1166).
      - name: tmux 3.7c (ubuntu's 3.4 crashes on a grouped session)
        env:
          TMUX_VERSION: "3.7c"
        run: |
          sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
          cd "$(mktemp -d)"
          curl -fsSL "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz" | tar xz
          cd "tmux-$TMUX_VERSION"
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          tmux -V
      - run: go build ./...
      - name: cross-compile cli for darwin (arm64, amd64)
        run: |
          GOOS=darwin GOARCH=arm64 go build ./cmd/repose
          GOOS=darwin GOARCH=amd64 go build ./cmd/repose
      - run: go vet ./...
      # -p 2 caps concurrent test packages against the single shared Postgres
      # service (ENG-113, DECISIONS I-1456).
      - run: go test -race -p 2 ./...
      # The steps below do not depend on the tests passing, and until
      # 2026-11-02 they were ordered as if they did: `go test -race` failed
      # on every run of `main` from 2026-10-17, so each of these was
      # skipped, and a step that never ran reports as "not failing", which
      # on the job list looks exactly like passing. `ci-green`'s errcheck
      # fix was therefore correct and unverified for sixteen days and
      # nothing in the signal could have said so. `!cancelled()` runs them
      # anyway: a red suite no longer hides what is behind it, and the job
      # still fails on the test (DECISIONS I-970).
      # Rollback is exercised on a seeded database: migrate, seed, down 1, up.
      - name: repose-admin db migrate --down 1 on a seeded database
        if: ${{ !cancelled() }}
        run: |
          go run ./cmd/repose-admin db migrate
          psql "$DATABASE_URL" -c "insert into users (id, handle) values ('00000000-0000-7000-8000-000000000001', 'ci-seed')"
          go run ./cmd/repose-admin db down 1
          go run ./cmd/repose-admin db status
          go run ./cmd/repose-admin db migrate
          go run ./cmd/repose-admin db verify
      # Built from source with the same toolchain go.mod pins; the prebuilt
      # action binaries lag the Go release and refuse newer go.mod versions.
      # An exact version, bumped by hand (DECISIONS I-429).
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
        if: ${{ !cancelled() }}
      - run: golangci-lint run ./...
        if: ${{ !cancelled() }}

  proto:
    name: buf lint and breaking
    needs: [changes]
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          lint: true
          # buf-action runs its formatter on pull requests unless told not
          # to, so this job failed on every PR and passed on every push to
          # main (I-840). The .proto files are written compact, with
          # one-line messages and aligned trailing comments, and
          # docs/interfaces quotes them that way; `buf format` expands all
          # of it. This job lints and detects breaking changes, which is
          # what its name says.
          format: false
          # And it posts a summary comment on every pull request unless
          # told not to. The workflow's token is `contents: read`, so the
          # post answers "Resource not accessible by integration" and the
          # action exits 1 after buf itself passed: every pull request run
          # from 2026-11-13 to 2026-11-20 was red for that and nothing
          # else, so a red run stopped meaning anything (I-1400). Nobody
          # reads these comments; the queue opens the pull requests and the
          # conductor reads the run.
          pr_comment: false
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: https://github.com/${{ github.repository }}.git#branch=main
          push: false
          version: 1.73.0

  nix:
    name: nix flake check (evaluate)
    needs: [changes]
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to the dev box's Nix: relative path inputs (the fragment
      # placeholder, DECISIONS I-28) are locked as "./..." entries that older
      # releases reject as unlocked.
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = kvm
      # Monolithic `nix flake check --no-build ./nix` evaluates every output in
      # one Nix heap, reaching 8.47 to 12 GiB RSS and OOM-killing 16 GB hosted
      # runners (ENG-144). Evaluating checks.x86_64-linux in 4 shards of ~10
      # checks each (equivalent to `nix eval --raw ./nix#checks.x86_64-linux.<attr>.drvPath`
      # across each shard), plus separate processes for checks.aarch64-linux,
      # packages, devShells, formatter and nixosConfigurations, asserts each
      # output is a derivation and forces its drvPath while releasing the heap
      # between shards so peak RSS stays <= 6.06 GiB (DECISIONS I-1456).
      - name: evaluate every output (sharded, ENG-144)
        run: |
          eval_drv_shards() {
            local target=$1 size=$2
            mapfile -t attrs < <(nix eval --json "./nix#$target" --apply builtins.attrNames | tr -d '[]"' | tr ',' '\n' | sed '/^$/d')
            [ "${#attrs[@]}" -gt 0 ] || { echo "no attributes under $target" >&2; exit 1; }
            local i=0 shard=0
            while [ "$i" -lt "${#attrs[@]}" ]; do
              shard=$((shard + 1))
              local slice=("${attrs[@]:$i:$size}")
              local nix_list="" a
              for a in "${slice[@]}"; do nix_list="$nix_list \"$a\""; done
              echo "--- $target shard $shard (${#slice[@]} attrs: ${slice[*]}) ---"
              nix eval --raw "./nix#$target" --apply "c: builtins.concatStringsSep \"\n\" (map (a: assert (c.\${a}.type or null) == \"derivation\"; a + \" -> \" + c.\${a}.drvPath) [ $nix_list ])"
              echo
              i=$((i + size))
            done
          }
          eval_drv_shards checks.x86_64-linux 11
          eval_drv_shards checks.aarch64-linux 10
          eval_drv_shards packages.x86_64-linux 12
          eval_drv_shards packages.aarch64-linux 12
          eval_drv_shards devShells.x86_64-linux 10
          eval_drv_shards devShells.aarch64-linux 10
          nix eval --raw ./nix#formatter --apply 'f: builtins.concatStringsSep "\n" (map (s: assert (f.${s}.type or null) == "derivation"; s + " -> " + f.${s}.drvPath) (builtins.attrNames f))'
          echo
          mapfile -t hosts < <(nix eval --json ./nix#nixosConfigurations --apply builtins.attrNames | tr -d '[]"' | tr ',' '\n' | sed '/^$/d')
          [ "${#hosts[@]}" -gt 0 ] || { echo "no nixosConfigurations" >&2; exit 1; }
          i=0; shard=0
          while [ "$i" -lt "${#hosts[@]}" ]; do
            shard=$((shard + 1))
            slice=("${hosts[@]:$i:6}")
            nix_list=""
            for a in "${slice[@]}"; do nix_list="$nix_list \"$a\""; done
            echo "--- nixosConfigurations shard $shard (${#slice[@]} hosts: ${slice[*]}) ---"
            nix eval --raw ./nix#nixosConfigurations --apply "c: builtins.concatStringsSep \"\n\" (map (a: assert (c.\${a}.config.system.build.toplevel.type or null) == \"derivation\"; a + \" -> \" + c.\${a}.config.system.build.toplevel.drvPath) [ $nix_list ])"
            echo
            i=$((i + 6))
          done
      # Every step below is conditioned, not just the ones that need to
      # outlive a failure: once one step in a job carries
      # `!cancelled()`, an unconditioned step after it is skipped by the
      # implicit `success()` as soon as anything above fails, and a
      # skipped step reads like a passing one (I-970, I-1000). These
      # builds are independent of each other, so a run that fails one
      # should still report the rest instead of stopping at the first.
      # panic_on_oops must stay a sysctl, not a kernel parameter (DECISIONS
      # I-988, I-1012). This asserts the CONFIG only, and is deliberately
      # blind to the fault I-988 actually was: there the config was right
      # and the kernel ignored the name. It catches an edit or an mkForce
      # deleting the sysctl, and nothing more. The assertion that the
      # kernel honoured it needs a booted VM, which needs KVM, which a
      # hosted runner does not have -- that half runs in host-reboot under
      # `nix flake check ./nix` on woker-1. `!cancelled()` because a
      # skipped step reads exactly like a passing one (I-970).
      - name: panic_on_oops is a sysctl and is 1
        if: ${{ !cancelled() }}
        run: |
          # Not --raw: the value is an integer and `nix eval --raw` fails
          # with "cannot coerce an integer to a string", which would make
          # this step fail for a reason that has nothing to do with the
          # setting.
          v=$(nix eval './nix#nixosConfigurations.host-02.config.boot.kernel.sysctl."kernel.panic_on_oops"')
          [ "$v" = "1" ] || { echo "kernel.panic_on_oops evaluates to '$v', want 1"; exit 1; }
      - name: build the Go binaries through the flake
        if: ${{ !cancelled() }}
        run: nix build --no-link "git+file://$GITHUB_WORKSPACE?dir=nix#guestd" "git+file://$GITHUB_WORKSPACE?dir=nix#hostd"
      # The fragment pipeline's real-Nix corpus (docs/interfaces/nix-build-contract.md
      # "Fixtures and the test corpus") and the menu's full-catalog evaluation.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          go-version-file: go.mod
      - name: real-nix corpus
        if: ${{ !cancelled() }}
        env:
          REPOSE_NIX_TESTS: "1"
          REPOSE_NIX_NETWORK: "1"
        run: go test -run 'TestRealNix' -v ./internal/hostd/nixbuild/ ./internal/menu/
      - name: fragment contract and examples
        if: ${{ !cancelled() }}
        run: nix build --no-link ./nix#checks.x86_64-linux.fragment-contract ./nix#checks.x86_64-linux.fragment-examples
      # Reads the guest's unit texts and runs each command-not-found
      # handler under a process limit (DECISIONS I-576, I-577); it builds
      # no part of the guest system.
      - name: guest keystroke path
        if: ${{ !cancelled() }}
        run: nix build --no-link -L ./nix#checks.x86_64-linux.guest-keystroke-path
      # The agent overlay, built and pushed to the platform cache
      # (DECISIONS I-46) when the Cachix token is configured; hosts then
      # substitute the agents instead of fetching upstream.
      - name: build the agent overlay
        if: ${{ !cancelled() }}
        run: nix build --no-link ./nix#claude-code ./nix#opencode ./nix#codex ./nix#gemini-cli ./nix#pi-coding-agent ./nix#chrome-devtools-mcp ./nix#playwright-mcp
      - name: push the overlay to Cachix
        if: env.CACHIX_AUTH_TOKEN != '' && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        # cachix from the flake's locked nixpkgs, not the registry's.
        run: |
          nix profile install --inputs-from "git+file://$GITHUB_WORKSPACE?dir=nix" nixpkgs#cachix
          nix build --print-out-paths --no-link ./nix#claude-code ./nix#opencode ./nix#codex ./nix#gemini-cli ./nix#pi-coding-agent ./nix#chrome-devtools-mcp ./nix#playwright-mcp             | cachix push repose

  # The same overlay for aarch64-linux (DECISIONS I-1374), on GitHub's
  # arm64 runner: the agents are prebuilt upstream binaries patched for
  # the architecture they run on, which no x86 runner can do without
  # binfmt. Pushed to the same Cachix cache, so an aarch64 host
  # substitutes them instead of fetching upstream. The base closure is
  # never pushed on either architecture (the cache's tier, I-46).
  nix-aarch64-overlay:
    name: aarch64 agent overlay (build, push to Cachix)
    needs: [changes]
    if: needs.changes.outputs.nix_overlay == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: build the aarch64 agent overlay
        run: nix build --no-link ./nix#packages.aarch64-linux.claude-code ./nix#packages.aarch64-linux.opencode ./nix#packages.aarch64-linux.codex ./nix#packages.aarch64-linux.gemini-cli ./nix#packages.aarch64-linux.pi-coding-agent ./nix#packages.aarch64-linux.chrome-devtools-mcp ./nix#packages.aarch64-linux.playwright-mcp
      - name: push the aarch64 overlay to Cachix
        if: env.CACHIX_AUTH_TOKEN != '' && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix profile install --inputs-from "git+file://$GITHUB_WORKSPACE?dir=nix" nixpkgs#cachix
          nix build --print-out-paths --no-link ./nix#packages.aarch64-linux.claude-code ./nix#packages.aarch64-linux.opencode ./nix#packages.aarch64-linux.codex ./nix#packages.aarch64-linux.gemini-cli ./nix#packages.aarch64-linux.pi-coding-agent ./nix#packages.aarch64-linux.chrome-devtools-mcp ./nix#packages.aarch64-linux.playwright-mcp | cachix push repose

  ops:
    name: alert rules, dashboards
    needs: [changes]
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          # The same pin as the nix job above, so CI runs one Nix.
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      # ops/check.sh falls back to `nix shell nixpkgs#prometheus.cli` when
      # promtool is not on PATH, which is the case here.
      - run: ops/check.sh
      - name: postgres compose validates (ops/coolify/postgres, DECISIONS I-87)
        run: POSTGRES_PASSWORD=x docker compose -f ops/coolify/postgres/docker-compose.yml config --quiet
      # Last in this job, and conditioned, for two reasons that pull the same
      # way: a step behind a conditioned one must be conditioned too, or the
      # lock in test/supplychain fires on it (DECISIONS I-1000); and this
      # check has never run in CI at all, so it must not be the step a failure
      # above it hides. It fails on a stale index and on a decision id cited
      # with no entry behind it (DECISIONS I-994).
      - name: the decisions index is current and no id is cited without an entry
        if: ${{ !cancelled() }}
        run: python3 ops/dev/decisions-index.py --check
      # The release-time check itself (ENG-43, step 2b of RELEASE.md) needs
      # tags, which this checkout has none of, so only its reading of the
      # docs runs here: --selftest takes no git at all. It fails if the
      # reader stops finding the command paths of the incident it exists
      # for, which is the way this check could start passing for nothing.
      - name: the docs-ahead-of-cli reader still finds a command path
        if: ${{ !cancelled() }}
        run: python3 ops/dev/docs-ahead-of-cli --selftest

  web:
    name: dashboard unit + e2e tests, Docker build
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    # Pinned, not `ubuntu-latest`: the runner image rolled to Ubuntu
    # 26.04 and Playwright 1.58.2 refuses to install a browser on it
    # ("Playwright does not support chromium on ubuntu26.04-x64"), which
    # reds this job on every branch at once (I-928). The version bump is
    # the real fix and wants its own run across the 330 specs; this pin
    # is what unreds main in the meantime. Raise it with that bump, not
    # on its own.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec vitest run
      - run: pnpm --filter web exec svelte-kit sync
      - run: pnpm --filter web exec svelte-check --tsconfig ./tsconfig.json
      - run: pnpm --filter web exec eslint .
      - run: pnpm --filter web build
      # The two Go fixtures (cmd/fakeapi, cmd/fake-logto) and the fake
      # Logto's own test suite (08-dashboard.md §7).
      - run: go test ./test/fake-logto/... ./internal/fakes/api/...
      - name: playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web exec playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      - name: docker build
        run: docker build -f apps/web/Dockerfile -t repose-web:ci .
      - name: image under 200 MB
        run: |
          size=$(docker image inspect repose-web:ci --format='{{.Size}}')
          echo "image size: $size bytes"
          test "$size" -lt 200000000
      - name: healthz on the built image
        run: |
          docker run -d --name web-ci -p 3000:3000 repose-web:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          test "$code" = "200"
          docker logs web-ci
