# The own-hardware hosts' release (DECISIONS I-1494, I-1496, I-1498,
# I-1684, I-1686).
#
# On a pull request touching them: the installer carries exactly the
# files the x86 hosts are built from (embed.sh --check), every script
# is shellcheck clean, and the kernel check passes its tests; and on a
# macOS runner the Mac's bundle builds twice, in two directories, to the
# same bytes (ops/mac/build-bundle.sh --twice).
#
# On a tag `appliance-<version>` (`git tag appliance-2026.11.28.1 && git push
# origin appliance-2026.11.28.1`):
#   mac       the Mac's bundle, repose-host-darwin-arm64.tar.gz, on a
#             macOS runner: hostd and repose-hostd-update for darwin,
#             repose-vm signed ad hoc with the virtualization
#             entitlement, e2fsprogs and zstd from their pinned sources.
#   hostd     hostd for linux amd64 and arm64 at <version>, manifest.json
#             for them (unchanged, I-1496), and manifest-darwin.json for
#             the Mac's bundle, both signed with the release key, published
#             together as the release hostd-<version>. Every x86 host finds
#             the newest such release through the releases API every 30
#             minutes (repose-hostd-update.timer), and every Mac too
#             (run.repose.hostd-update). There is no moving channel
#             release: releases here are immutable, and hostd-stable is a
#             dead name (I-1496). `repose host add` on a Mac installs the
#             version internal/cli/machost.go pins (macHostVersion), so
#             this release is published before the CLI that pins it.
# The Mac appliance image (design 1) is no longer built: no CLI from
# design 2 on fetches it (I-1684).
# Every release here is --latest=false: releases/latest is the CLI's, and
# install.sh and `repose version` read it.
#
# The signing key is the release environment's secret; the owner limits
# that environment to tags, and `appliance-*` must be among its patterns.
name: appliance-image
on:
  pull_request:
    paths:
      - images/appliance-arm64/**
      - ops/install-host-x86.sh
      - ops/install-host-x86-test
      - ops/mac/**
      - cmd/repose-vm/**
      - cmd/repose-hostd-update/**
      - internal/machost/**
      - .github/workflows/appliance-image.yml
  push:
    tags: ["appliance-*"]
    # The design 2 program's branches run check and mac (never hostd, which
    # only a tag reaches), as no pull request of theirs exists before the
    # program merges to main (DECISIONS I-1688). Drop with that merge.
    branches: ["design2", "d2-*"]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the installer carries the appliance's files
        run: images/appliance-arm64/embed.sh --check
      - name: shellcheck
        run: shellcheck ops/install-host-x86.sh ops/install-host-x86-test images/appliance-arm64/*.sh images/appliance-arm64/host/bin/* images/appliance-arm64/x86/bin/* ops/mac/build-bundle.sh cmd/repose-vm/build.sh
      - name: the installer's kernel check
        run: ops/install-host-x86-test
      - name: the installer's dry run
        run: bash ops/install-host-x86.sh --dry-run --join e30 --loop-file "$RUNNER_TEMP/guests.img" --size 20 --uplink eth0

  mac:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build the Mac's bundle twice and compare
        env:
          REF: ${{ github.ref_name }}
        run: |
          swiftc --version
          v=0.0.0
          case $REF in appliance-*) v=${REF#appliance-} ;; esac
          mkdir dist
          ops/mac/build-bundle.sh --twice "$v" dist/repose-host-darwin-arm64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: dist/

  hostd:
    if: startsWith(github.ref, 'refs/tags/appliance-')
    needs: [mac]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build hostd
        run: |
          v=${VERSION#appliance-}
          mkdir dist
          for a in amd64 arm64; do
            GOOS=linux GOARCH=$a CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$v" \
              -o "dist/hostd-linux-$a" ./cmd/hostd
          done
          (cd dist && sha256sum hostd-linux-* > SHA256SUMS)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mac
          path: dist/
      - name: publish hostd-<version> with its signed manifests
        env:
          REPOSE_RELEASE_SIGNING_KEY: ${{ secrets.REPOSE_RELEASE_SIGNING_KEY }}
        run: |
          v=${VERSION#appliance-}
          if [ -z "$REPOSE_RELEASE_SIGNING_KEY" ]; then
            echo "::error::REPOSE_RELEASE_SIGNING_KEY is not set in the release environment; nothing is published"
            exit 1
          fi
          key="$RUNNER_TEMP/release-signing-key.pem"
          (umask 077 && printf '%s\n' "$REPOSE_RELEASE_SIGNING_KEY" > "$key")
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/hostd-$v"
          images/appliance-arm64/hostd-manifest.sh "$v" \
            dist/hostd-linux-amd64 "$base/hostd-linux-amd64" \
            dist/hostd-linux-arm64 "$base/hostd-linux-arm64" "$key" > dist/manifest.json
          go run ./ops/mac/bundle manifest --version "$v" --bundle dist/repose-host-darwin-arm64.tar.gz \
            --url "$base/repose-host-darwin-arm64.tar.gz" --key "$key" > dist/manifest-darwin.json
          rm -f "$key"
          (cd dist && sha256sum hostd-linux-* repose-host-darwin-arm64.tar.gz > SHA256SUMS)
          # One create with every asset: the repository's releases are
          # immutable once published, so nothing can be added later, and a
          # host finds this release by its manifest.json (I-1496).
          gh release create "hostd-$v" --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "hostd $v" --notes "hostd $v for hosts without Nix: x86 machines (ops/install-host-x86.sh) and Macs (repose host add)." \
            dist/hostd-linux-amd64 dist/hostd-linux-arm64 dist/SHA256SUMS dist/manifest.json \
            dist/repose-host-darwin-arm64.tar.gz dist/manifest-darwin.json
          # The binaries and the manifest answer anonymously.
          for f in hostd-linux-amd64 hostd-linux-arm64 manifest.json repose-host-darwin-arm64.tar.gz manifest-darwin.json; do
            curl -fsSL -o "$RUNNER_TEMP/h" "$base/$f"
            cmp "$RUNNER_TEMP/h" "dist/$f"
          done

