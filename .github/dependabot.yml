# Actions are pinned by commit (DECISIONS I-429). Dependabot proposes the
# new commit and version comment as a PR; a person reviews and merges it.
#
# One group, so the week's action updates arrive as one PR. Ungrouped, each
# action got its own, five at a time against the default open-PR limit, and
# six sat open from 2026-10-04 to 2026-10-20 while the limit hid the rest
# (DECISIONS I-840).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
