<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 91 91">
	<!-- The logo (Logo.svelte, DECISIONS I-779) at its own weight: the mark
	     holds at 16px, so the tab shows the same drawing the header does.
	     Colours are the landing's --sh-* values; the disc takes the page
	     ink, and flips with the scheme so it shows on a dark tab bar.
	     favicon.png is this drawing in the light colours. -->
	<style>
		.i { fill: #181817; }
		.a { fill: #4d6fb3; }
		@media (prefers-color-scheme: dark) {
			.i { fill: #f3f3f1; }
			.a { fill: #8aa4d8; }
		}
	</style>
	<circle class="i" cx="40" cy="40" r="36" />
	<path class="a" d="M34.1 76.8A32 32 0 0 0 76.8 34.1A39 39 0 0 1 34.1 76.8Z" />
</svg>
