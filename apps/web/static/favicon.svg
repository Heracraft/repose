<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 92 92">
	<!-- The logo (Logo.svelte, DECISIONS I-779) at its own weight: the mark
	     holds at 16px, so the tab shows the same drawing the header does.
	     Colours are the landing's --sh-* values; the mother cell takes the
	     page ink and flips with the scheme so it shows on a dark tab bar.
	     favicon.png is this drawing in the light colours. -->
	<style>
		.i { fill: #181817; }
		.a { fill: #4d6fb3; }
		@media (prefers-color-scheme: dark) {
			.i { fill: #f3f3f1; }
			.a { fill: #8aa4d8; }
		}
	</style>
	<path class="i" d="M32.5 49.5A23 23 0 1 1 49.5 32.5A18 18 0 0 0 54.3 49.4L49.4 54.3A18 18 0 0 0 32.5 49.5Z" />
	<path class="a" d="M70.6 54.3A21 21 0 1 1 54.3 70.6A18 18 0 0 0 49.4 54.3L54.3 49.4A18 18 0 0 0 70.6 54.3Z" />
