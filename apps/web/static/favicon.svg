<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 88 88">
	<!-- The logo (Logo.svelte, DECISIONS I-779) at its own weight: the mark
	     holds at 16px, so the tab shows the same drawing the header does.
	     Colours are the landing's --sh-* values; the L takes the page ink,
	     and flips with the scheme so it shows on a dark tab bar.
	     favicon.png is this drawing in the light colours. -->
	<style>
		.i { fill: #181817; }
		.a { fill: #4d6fb3; }
		@media (prefers-color-scheme: dark) {
			.i { fill: #f3f3f1; }
			.a { fill: #8aa4d8; }
		}
	</style>
	<path class="i" d="M6 6h22v66h66v22H6Z" />
	<rect class="a" x="44" y="34" width="38" height="38" />
</svg>
