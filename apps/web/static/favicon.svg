<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 9 82 82">
	<!-- The logo (Logo.svelte, DECISIONS I-779) at its own weight: the mark
	     holds at 16px, so the tab shows the same drawing the header does.
	     Colours are the landing's sh-accent and ink values; the mother cell
	     takes the page ink and flips with the scheme so it shows on a dark
	     tab bar. favicon.png is this drawing in the light colours. No
	     double hyphen in this comment: XML forbids it inside one, and a
	     favicon that does not parse is dropped for favicon.png, which
	     takes the dark scheme with it (I-938). -->
	<style>
		.i { fill: #181817; }
		.a { fill: #4d6fb3; }
		@media (prefers-color-scheme: dark) {
			.i { fill: #f3f3f1; }
			.a { fill: #8aa4d8; }
		}
	</style>
	<path class="i" d="M42.7 53.3A23 23 0 1 1 53.3 42.7A5.6 5.6 0 0 0 54.3 49.2L49.2 54.3A5.6 5.6 0 0 0 42.7 53.3Z" />
	<path class="a" d="M60.6 50.3A21 21 0 1 1 50.3 60.6A5.6 5.6 0 0 0 49.2 54.3L54.3 49.2A5.6 5.6 0 0 0 60.6 50.3Z" />
</svg>
