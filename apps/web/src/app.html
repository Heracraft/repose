<!doctype html>
<html lang="en">
	<head>
		<title>repose</title>
		<meta charset="utf-8" />
		<!-- ?v= makes browsers drop the mark they cached (DECISIONS I-779). -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg?v=3" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png?v=3" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The dashboard renders in the browser (ssr = false), and the
		     prerendered pages (the landing, I-398, the docs and the legal
		     pages) link their CSS as a file. Until that CSS arrives the page
		     would paint the browser's default white, and a dark-mode visitor
		     sees a white flash. These match --page in routes/layout.css so the
		     first paint is already the right colour. -->
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
		<!-- Marks the page as scripted before the first paint, so a style can
		     tell "the bundle is on its way" from "scripts are off": the
		     landing's hero draws its pre-run frame under html.js and stays
		     whole without it. The CSP (svelte.config.js) allows no inline
		     script it has no hash for, so script-src carries this one's
		     sha256 ('sha256-aL3Pv6ygSyucrLwgv7XagHcNUqYEpcwpRZTImp8W7/g=');
		     the hash covers the text between the tags, its tabs and
		     newlines included, so any change to it changes the hash. -->
		<script>
			document.documentElement.classList.add('js');
		</script>
		<style>
			html {
				background: #fbfbfa;
				color: #181817;
			}
			@media (prefers-color-scheme: dark) {
				html {
					background: #111110;
					color: #f3f3f1;
				}
			}
			/* The route renders as soon as its script runs, which can be
			   before its stylesheet has loaded. Hidden until routes/layout.css
			   sets visibility back, so nothing paints unstyled. */
			body {
				visibility: hidden;
			}
		</style>
		<!-- The fonts are self-hosted (static/fonts, @font-face in
		     routes/layout.css). Three cuts are fetched before the CSS that
		     names them arrives: Noto Serif 700 is the landing's headline, 600
		     every dashboard title, and JetBrains Mono 400 the landing's
		     install command and its pictures' rows, all above the fold. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/noto-serif-latin-700-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/noto-serif-latin-600-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono-latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
