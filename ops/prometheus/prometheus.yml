# Prometheus on the owner's personal server (the one that already runs Loki,
# Grafana and Alertmanager: DECISIONS R2-9). It scrapes repose over the edge's
# WireGuard and nothing over the internet, which is why every job's targets
# are 10.255.0.0/16 addresses (docs/ops/OBSERVABILITY.md "Where things are").
#
# Retention is 90 days, which is a command-line flag, not a config key:
#
#   prometheus --config.file=/etc/prometheus/prometheus.yml \
#              --storage.tsdb.path=/var/lib/prometheus \
#              --storage.tsdb.retention.time=90d \
#              --web.enable-lifecycle
#
# A host is added by appending it to targets/hosts.yml; three jobs (node
# exporter, hostd, Fluent Bit) pick it up from the same file, because the
# file lists bare addresses and each job relabels its own port on. That is
# one edit per host instead of three.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 1m
  external_labels:
    env: prod
    stack: repose

rule_files:
  - /etc/prometheus/repose/alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  # node_exporter on every host: CPU, memory, filesystems (StoreFull reads
  # node_filesystem_* from this job), systemd unit states, and the textfile
  # collector the pool monitor writes into.
  - job_name: hosts
    file_sd_configs:
      - files: ["/etc/prometheus/repose/targets/hosts.yml"]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __address__
        regex: "([^:]+)(:.*)?"
        replacement: "${1}:9100"

  # hostd's own surface: every repose_host_* series of
  # docs/workstreams/10-observability.md §5.
  - job_name: hostd
    file_sd_configs:
      - files: ["/etc/prometheus/repose/targets/hosts.yml"]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __address__
        regex: "([^:]+)(:.*)?"
        replacement: "${1}:9101"

  # Fluent Bit's own metrics, for the one failure only it can see: a host
  # that has stopped shipping logs (§6, alert FluentBitStuck).
  - job_name: fluent-bit
    metrics_path: /api/v1/metrics/prometheus
    file_sd_configs:
      - files: ["/etc/prometheus/repose/targets/hosts.yml"]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __address__
        regex: "([^:]+)(:.*)?"
        replacement: "${1}:2021"

  # The edge: the gateway's sessions and auth failures. One edge, so it is a
  # static target. The address is the WireGuard hub's own; workstream 06 owns
  # the 10.255.0.0/16 plan, so confirm it against `wg show wg0` on the edge
  # before believing a job that is down.
  - job_name: gateway
    static_configs:
      - targets: ["10.255.0.1:9102"]
        labels:
          role: edge

  # The control VM: the api. It is a WireGuard peer of the edge for this
  # scrape and for nothing else (docs/workstreams/10-observability.md §2);
  # its HTTP surface is reached by users over the internet, not from here.
  #
  # Two targets, one per process: `api` and `api-grpc` are separate
  # Coolify applications from the same image (DECISIONS I-2), each with
  # its own registry, and the series split between them — the HTTP
  # families come from `api`, the stream, ops and outbox families from
  # `api-grpc`. The `app` label tells them apart in a panel.
  #
  # They are reached two different ways, and the difference is not
  # arbitrary. `api-grpc` accepts stop-then-start, so it can publish a
  # host port (9104 -> 9103) and be scraped directly on the control VM's
  # WireGuard address. `api` must keep its rolling deploys, so it
  # publishes nothing and its /metrics is served by the Traefik router
  # in front of it, behind an IP allow-list (DECISIONS I-133,
  # ops/coolify/README.md "The api's metrics").
  #
  # The `api` target is the *name*, not the address, because the router
  # matches on the Host header. The monitoring server points that name
  # at 10.255.255.1 in /etc/hosts so the request still goes over the
  # tunnel; ops/prometheus/wireguard-peer.conf step 4 has the line.
  - job_name: api
    scheme: https
    static_configs:
      - targets: ["api.repose.herakraft.co:443"]
        labels:
          role: control-plane
          app: api

  - job_name: api-grpc
    static_configs:
      - targets: ["10.255.255.1:9104"]
        labels:
          role: control-plane
          app: api-grpc

  # The control VM's own machine: its filesystems, memory and CPU
  # (DECISIONS I-800). Nothing watched this disk, and Postgres is on it: a
  # full disk there stops every start, every sample and every invoice at
  # once, and the api answers 503 for a reason no host alert explains.
  #
  # Its own job, not the `hosts` file: `HostServiceDown` asserts
  # hostd.service on the `hosts` job, and the control VM runs no hostd, so
  # adding it there would fire that alert for ever. node_exporter is
  # installed on the VM itself and published on its WireGuard address only
  # (ops/coolify/README.md).
  - job_name: control-node
    static_configs:
      - targets: ["10.255.255.1:9100"]
        labels:
          role: control-plane
