# Every repose host, by WireGuard address, with the labels the dashboards and
# alerts group by. One entry per host; the three host jobs in prometheus.yml
# (node exporter :9100, hostd :9101, Fluent Bit :2021) relabel their own port
# onto the address, so adding a host is one edit here.
#
# host_id is the id the api issued at registration, which is what every
# repose_host_* series, log line and runbook step names, and what
# HostNotInTargets compares these entries against (I-786): the api reports
# every ready host by id, and a ready host no entry here carries is reported
# by name. The WireGuard address comes from the host's own
# /run/repose/host.env (WG_ADDR) or `wg show wg0 allowed-ips` on the edge;
# `repose-admin hosts list` does not print it.
#
# Prometheus re-reads this file every minute; no restart and no reload.
# host-01's address came out of its registration as 10.255.0.2 (verified
# on the edge with `wg show wg0 allowed-ips`, 2026-09-20); an earlier
# draft of this file guessed .7 from the ".4 and up" convention, which
# the allocator does not follow.
- targets: ["10.255.0.2"]
  labels:
    host_id: "host-01"
    region: "eastus"

# host-02's address has not been read off the host yet. Until this entry is
# copied to the monitoring server, HostNotInTargets names host-02 by id
# fifteen minutes after it registers, and HostUnregistered names it half an
# hour after `hosts add` if it never does (I-786). 10.255.0.4 is what the
# allocator gives the second host row ever to finish Register: the sequence
# number comes from nextval('host_seq'), which every Register consumes --
# a re-register after a token reissue included -- and .3 is skipped because
# the monitoring server holds it (I-359, I-782). So this is arithmetic, not a
# fact: once host-02 has registered, read the real address from
# `repose-admin hosts list` or the host's /run/repose/host.env (WG_ADDR) and
# correct this line.
- targets: ["10.255.0.4"]
  labels:
    host_id: "host-02"
    region: "eastus"
