# Every repose host, by WireGuard address, with the labels the dashboards and
# alerts group by. One entry per host; the three host jobs in prometheus.yml
# (node exporter :9100, hostd :9101, Fluent Bit :2021) relabel their own port
# onto the address, so adding a host is one edit here.
#
# host_id is the id the api issued at registration, which is what every
# repose_host_* series, log line and runbook step names, and what
# HostNotInTargets compares these entries against (I-786): the api reports
# every ready host by id, and a ready host no entry here carries is reported
# by name. The WireGuard address comes from the host's own
# /run/repose/host.env (WG_ADDR) or `wg show wg0 allowed-ips` on the edge;
# `repose-admin hosts list` does not print it.
#
# Prometheus re-reads this file every minute; no restart and no reload. An
# entry for a host that no longer exists pages HostScrapeDown for ever, so a
# host leaves this file in the same change that destroys it (I-976).
#
# host-01's entry was removed when it was retired on 2026-11-02, its sixteen
# projects moved to host-02. Its address was 10.255.0.2.
#
# host-02 is at 10.255.0.4, read off the running host, not inferred: `wg show
# wg0 allowed-ips` on the edge reports it against host-02's public key
# (2026-11-02), and SSH to that address answers `host-02`. The arithmetic the
# earlier draft of this comment used -- nextval('host_seq') with .3 skipped
# for the monitoring server (I-359, I-782) -- happened to agree, but it is the
# measurement that makes this a fact.
- targets: ["10.255.0.4"]
  labels:
    host_id: "host-02"
    region: "eastus"
