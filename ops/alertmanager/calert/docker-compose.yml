# calert next to Alertmanager on the personal server (DECISIONS I-648).
# Alertmanager reaches it at 127.0.0.1:6000; nothing else can.
#
#   install -d -m 0755 /etc/calert
#   cp config.toml message.tmpl /etc/calert/
#   read -rsp 'Chat webhook URL: ' u; (umask 077; printf 'CALERT_PROVIDERS__REPOSE__ENDPOINT=%s\n' "$u" > /etc/calert/calert.env); unset u
#   docker compose -f docker-compose.yml up -d
#
# In Coolify instead: paste this as a Docker Compose service and put
# CALERT_PROVIDERS__REPOSE__ENDPOINT in its Environment tab as a secret.
services:
  calert:
    image: ghcr.io/mr-karan/calert:v2.4.0
    command: ["--config", "/etc/calert/config.toml"]
    env_file: /etc/calert/calert.env
    volumes:
      - /etc/calert/config.toml:/etc/calert/config.toml:ro
      - /etc/calert/message.tmpl:/etc/calert/message.tmpl:ro
    ports:
      - "127.0.0.1:6000:6000"
    restart: unless-stopped
