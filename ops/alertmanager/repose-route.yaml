# The Alertmanager route for repose, to merge into the personal server's
# alertmanager.yml (DECISIONS I-648, amended by I-848). Alerts are emailed
# to the owner by Alertmanager itself.
#
# Email and not Google Chat, which was I-648's choice: Alertmanager has no
# Google Chat receiver, so Chat needed calert beside it to translate the
# webhook. That put a process in the alert path that nothing watched --
# `Watchdog` goes straight to Kuma and never touches it -- so a dead calert
# would have taken every other alert with it and left the heartbeat green.
# That is the shape of the 2026-10-10 outage this routing was written for.
# Alertmanager's email receiver is built in and has no such part. Azure's
# own alerts already email the same address for the same reason (I-648,
# "Azure"): the email arrives when everything of the owner's is down.
#
# Both email receivers go to the same address and differ only in timing. A
# page is sent after 20 s and repeated hourly, everything else waits 30 s
# for its group and repeats every 12 h. The subject names the severity
# first, so a page reads as one in a notification.
#
# Watchdog always fires and goes to an Uptime Kuma push monitor every minute
# (repeat_interval is under group_interval, so no tick is skipped).
# When the pushes stop (Prometheus, Alertmanager or the whole server down),
# Kuma posts to the same Chat space itself. The push URL is read from a file,
# because a URL anyone can push to is a way to hide an outage.
#
# Nothing secret is in this file. The SMTP password (a Resend API key) is
# read from auth_password_file and the Kuma push URL from url_file, both
# 0600 under /etc/alertmanager/secrets (ops/README.md, install step 3, has
# the commands). Set `smtp_from` and the two `to:` addresses to the same
# address Azure's alerts use (`alert_email` in prod.local.tfvars); one
# inbox for both is the point.

# Merge this into alertmanager.yml's own `global:` as well. Resend is
# already the api's mail sender with repose.herakraft.co verified
# (LAUNCH.md step 2), so alerting reuses it rather than adding a provider:
# the username is the literal string `resend` and the password is a Resend
# API key, in a 0600 file.
global:
  smtp_smarthost: smtp.resend.com:587
  smtp_from: repose alerts <alerts@repose.herakraft.co>
  smtp_auth_username: resend
  smtp_auth_password_file: /etc/alertmanager/secrets/repose-smtp-password
  smtp_require_tls: true

route:
  receiver: repose-email
  group_by: [alertname, host_id]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers:
        - stack = "repose"
        - alertname = "Watchdog"
      receiver: repose-watchdog
      group_wait: 0s
      group_interval: 1m
      # Below group_interval: at 1m, a flush a few milliseconds short of
      # repeat_interval was skipped, so pushes came 2 minutes apart.
      repeat_interval: 30s
    - matchers:
        - stack = "repose"
        - severity = "page"
      receiver: repose-email-page
      # Long enough for an inhibition to settle when two page alerts for one
      # outage start in the same minute (HostdDown and HostUnreachable).
      group_wait: 20s
      repeat_interval: 1h
    - matchers:
        - stack = "repose"
      receiver: repose-email

receivers:
  - name: repose-email
    email_configs:
      - to: CHANGEME@example.invalid
        send_resolved: true
        headers:
          Subject: '[{{ .CommonLabels.severity }}] {{ .GroupLabels.alertname }}{{ if .CommonLabels.host_id }} on {{ .CommonLabels.host_id }}{{ end }} ({{ .Status }})'
        text: |
          {{ range .Alerts }}{{ .Annotations.summary }}

          {{ .Annotations.description }}

          Runbook: {{ .Annotations.runbook }}
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}

  - name: repose-email-page
    email_configs:
      - to: CHANGEME@example.invalid
        send_resolved: true
        headers:
          Subject: 'PAGE: {{ .GroupLabels.alertname }}{{ if .CommonLabels.host_id }} on {{ .CommonLabels.host_id }}{{ end }} ({{ .Status }})'
        text: |
          {{ range .Alerts }}{{ .Annotations.summary }}

          {{ .Annotations.description }}

          Runbook: {{ .Annotations.runbook }}
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}

  - name: repose-watchdog
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/repose-watchdog-url
        send_resolved: false

# Silences: `amtool silence add alertname=SnapshotStale --duration 2h
# --comment "why"`. A silence with no comment is deleted by a nightly job
# (docs/ops/OBSERVABILITY.md), because a silence nobody can explain outlives
# the reason for it.
inhibit_rules:
  # A host Prometheus cannot reach produces every host alert at once as its
  # series go stale; the scrape failure is the one worth reading. HostdDown
  # is the page for that same failure, so it is never the one held back.
  - source_matchers: [alertname = "HostScrapeDown"]
    target_matchers: [severity =~ "warn|page", alertname != "HostdDown"]
    equal: [host_id]
  - source_matchers: [alertname = "HostdDown"]
    target_matchers: [severity = "warn"]
    equal: [host_id]
  # A guest pool that is down sets off every pool alert of its host
  # (DECISIONS I-644); PoolUnavailable is the one that says what happened.
  - source_matchers: [alertname = "PoolUnavailable"]
    target_matchers: [alertname =~ "PoolHigh|PoolFull|PoolMetadataHigh|PoolUnmonitored"]
    equal: [host_id]
  # An unreachable host is the api's view of the same thing.
  - source_matchers: [alertname = "HostUnreachable"]
    target_matchers: [alertname = "GuestdLost"]
  # One page for a host that is gone: HostdDown names the host, and
  # HostUnreachable (an api-wide count with no host_id) does not. With one
  # host this is exact; with two, a scrape failure on one hides the other's
  # HostUnreachable page, which HostdDown for that host still sends.
  - source_matchers: [alertname = "HostdDown"]
    target_matchers: [alertname = "HostUnreachable"]
  # Prometheus reaches every target through the edge's WireGuard, so a dead
  # edge or tunnel fails gateway, hostd and both api scrapes at once.
  # MonitoringPathDown is the one page for that; it fires a minute before
  # the others so this holds them back before their group_wait ends.
  - source_matchers: [alertname = "MonitoringPathDown"]
    target_matchers: [alertname =~ "GatewayDown|HostdDown|ApiDown|ApiHostsAbsent"]
  # api-grpc down takes repose_api_hosts with it; ApiDown is the cause.
  - source_matchers: [alertname = "ApiDown"]
    target_matchers: [alertname = "ApiHostsAbsent"]
