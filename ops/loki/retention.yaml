# The retention half of the personal server's Loki configuration, to merge
# into whatever else that Loki does. docs/ops/OBSERVABILITY.md: console logs
# 30 days, component logs 90.
#
# Why they differ: a component log line is ours, carries ids and enums, and is
# what an incident three months later is reconstructed from. A console log is
# whatever a tenant's process printed to the serial device; it is diagnostic
# for days, not months, and the longer it is kept the more of someone else's
# data we are holding (DESIGN §15, the privacy policy's process-sample
# boundary). 30 days is enough to explain a crash loop and short enough to be
# defensible.
#
# Retention only happens if the compactor is running with it enabled; a
# retention_period with no compactor is a config file that lies.

limits_config:
  # The default for every stream: repose component logs (hostd, guestd,
  # api, gateway) and anything else on this Loki.
  retention_period: 2160h # 90 days

  # Per-stream overrides, highest priority first. The selector matches the
  # label Fluent Bit sets from the Lua filter in nix/hosts/fluent-bit.nix.
  retention_stream:
    - selector: '{component="console"}'
      priority: 1
      period: 720h # 30 days

  # Ingestion limits (DECISIONS I-452). A console stream is one guest
  # (guest_id is a label), so a per-stream limit keeps one noisy guest from
  # costing another its lines; hostd already holds each console to 2 KiB a
  # second with a 1 MiB burst, well under these. The tenant-wide rate
  # covers every host's journal and consoles together.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB
  max_label_names_per_series: 15

compactor:
  working_directory: /var/lib/loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

# Verifying retention after a change:
#
#   curl -s localhost:3100/config | grep -A4 retention
#   # and, a day later, that the compactor logged a deletion:
#   journalctl -u loki | grep -i 'retention\|delete'
