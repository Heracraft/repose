# Prometheus alert rules for repose. One rule per alert in
# docs/CHECKLIST.md and docs/workstreams/10-observability.md §5, plus the
# three §6 failure modes that are only visible from outside: a host that
# stopped shipping logs, a host Prometheus cannot scrape, and partition
# maintenance that is not running.
#
# Every alert name is a heading in docs/ops/RUNBOOK.md, and `promtool test
# rules ops/alerts_test.yaml` has a case per rule.
#
# WHAT ACTUALLY EVALUATES THESE: Grafana, not Prometheus and not an
# Alertmanager. ops/grafana/alerts-gen.py generates Grafana's own alert rules
# from this file and ops/grafana/push.py puts them in over Grafana's API
# (DECISIONS I-942, I-944). Prometheus loads no rule_files. This file stays
# the single source of truth. The Alertmanager configuration that used to
# route it is deleted (DECISIONS I-956); `Watchdog` stays here and is the
# one alert Grafana is not given (I-944).
#
# Severity: `page` wakes someone (tenants are down or data is at risk),
# `warn` is a notification that can wait for the morning.
groups:
  - name: repose-hosts
    interval: 1m
    rules:
      - alert: HostMemory80
        # Memory is never oversubscribed (DESIGN §4), so reserved memory is
        # the capacity figure: at 80 percent the next `repose run` of an XL
        # may not fit and a human runs the OpenTofu apply for another host
        # (DECISIONS R3-5).
        expr: |
          repose_host_mem_reserved_bytes
            / (repose_host_mem_reserved_bytes + repose_host_mem_free_bytes) > 0.8
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "host {{ $labels.host_id }} is over 80 percent reserved memory"
          description: "{{ $value | humanizePercentage }} of usable memory is reserved by running guests. Add a host before the next XL create fails."
          runbook: "docs/ops/RUNBOOK.md#hostmemory80"

      - alert: HostCPUSaturated
        # Memory had HostMemory80 and CPU had nothing, so on 2026-10-14 the
        # owner found a fleet-wide latency problem by feel
        # (docs/proposals/2026-10-14-host-cpu-capacity.md §1-§3; DECISIONS
        # I-738). Busy guest vCPUs per PHYSICAL core is the quantity the
        # measurement is in: on host-01 (a D16s_v7, 16 Azure vCPUs = 8
        # cores), measured into a guest with nothing running in it, 0.5 per
        # core echoed a keystroke in 2.7 ms p50 / 4.3 ms p90 and opened an
        # ssh session in 0.2 s; 1.8 per core gave 17.0 ms p50 / 44.5 ms p90
        # and 2.0 s. Degradation is already visible at 1.2 per core
        # (keystroke p90 42 ms), so 1 is the boundary the measurement names
        # rather than a round number, and placement holds commitments to 1.5
        # per core (I-734) on the duty cycle that keeps busy vCPUs under it.
        # Throughput barely moves while this happens, which is why no other
        # capacity series says anything.
        #
        # 15m, like PoolHigh: longer than one `nix build` burst or a single
        # agent run, short enough that the hours-long state the owner felt is
        # reported the same morning. Nothing is down, no data is at risk and
        # the remedy is a human OpenTofu apply for a bigger or another host,
        # so it warns. sum by (host_id) on both sides keeps host_id, so
        # group_by and the HostdDown/HostScrapeDown inhibitions still match.
        expr: |
          sum by (host_id) (rate(repose_host_guest_cpu_seconds_total[5m]))
            / sum by (host_id) (repose_host_cpu_cores) > 1
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: 'host {{ $labels.host_id }} is running {{ $value | printf "%.2f" }} busy guest vCPUs per physical core'
          description: "Over one busy guest vCPU per core for 15 minutes: typing is laggy in every guest on this host, including guests doing nothing, and sessions take seconds to open. Add a host or move to a larger SKU; nothing on the host itself fixes it."
          runbook: "docs/ops/RUNBOOK.md#hostcpusaturated"

      - alert: HostKernelTainted
        # The kernel's own latched verdict on the host, which is what
        # KernelOops is not. On 2026-11-02 host-02 took its first
        # __d_lookup_rcu fault at 13:51:07 and kept serving tenant
        # filesystem traffic through virtiofsd for 3 h 48 m with a dentry
        # cache it could not read, then hard-hung (DECISIONS I-982).
        # KernelOops would have paged at ~13:53 and gone green at ~14:01:
        # 8 minutes of alert for 3 h 48 m of untrustworthy host, because it
        # counts log lines in a window and the window moves on. A taint bit
        # does not. It is set by the fault and stands until the box reboots,
        # so this rule still fires at 17:39 (I-1010).
        #
        # Three reasons, not the word: bits 0, 12 and 13 (a proprietary,
        # out-of-tree or unsigned module) are set on every healthy host and
        # never clear, so `tainted != 0` would page for ever. Decomposed in
        # hostd because PromQL has no bitwise AND. soft_lockup and warn are
        # exported and alert on nothing -- a soft lockup is load, which
        # HostCPUSaturated covers, and a warning is a condition the kernel
        # recovered from (the division KernelOops already drew, I-980).
        #
        # Also fires when hostd could not read /proc/sys/kernel/tainted at
        # all: the gauge means "latched, or cannot be ruled out", because a
        # host whose verdict is unreadable is not a host known to be clean.
        #
        # for: 0m and page. With panic_on_oops on (I-984, I-988) an oops
        # panics and panic=30 reboots, so `die` is rarely scrapable and
        # HostdDown is its page; what this rule uniquely buys is
        # machine_check and bad_page, which taint without panicking, and the
        # standing signal. max by (host_id) is one page per host rather than
        # one per bit; the description says how to read which.
        expr: max by (host_id) (repose_host_kernel_tainted{reason=~"die|machine_check|bad_page"}) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "the kernel on host {{ $labels.host_id }} is tainted or unreadable"
          description: "This host's kernel has latched a hard fault, or hostd could not read its taint word. It stays set until the host reboots. Drain the host; do not wait for it to clear. `curl -s 10.255.0.N:9101/metrics | grep kernel_tainted` says which reason."
          runbook: "docs/ops/RUNBOOK.md#hostkerneltainted"

      - alert: HostPanicOnOopsOff
        # kernel.panic_on_oops is how I-984 is in effect, and I-988 is why
        # it is read back rather than assumed: it shipped first as a kernel
        # parameter, the kernel refused it as one and said so, and
        # /proc/cmdline still carried it. The sysctl is the knob and this
        # gauge is the only thing that says the knob is on.
        #
        # 15m and warn: a switch's activation sets it, so a host switching
        # or booting reads 0 for a moment, and nothing is wrong until it
        # stays off. Nothing is down and no tenant data is at risk while it
        # is -- the cost is the next oops being survived instead of
        # rebooted, which is what 2026-11-02 cost 3 h 48 m.
        expr: repose_host_panic_on_oops == 0
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "host {{ $labels.host_id }} would survive a kernel oops instead of rebooting"
          description: "kernel.panic_on_oops is off or unreadable on this host, so an oops leaves it serving tenants with a kernel it cannot trust. `sysctl kernel.panic_on_oops` on the host; it is set by nix/hosts/kernel.nix and applied by a switch, so a host that has not been switched since I-988 reads 0."
          runbook: "docs/ops/RUNBOOK.md#hostpaniconoopsoff"

      - alert: HostKernelAssertFailed
        # The boot-time facts about a host that nothing else reads back.
        # repose-kernel-check writes them to node_exporter's textfile
        # directory once a minute: large_hash_linear is a positive read of
        # the `Dentry cache hash table ... linear` line, which is the
        # allocation path that has never faulted (I-982), and
        # cmdline_recognised is the absence of `Unknown kernel command line
        # parameters`, the exact line that caught I-988 after a host had
        # been switched and rebooted for a parameter the kernel never took.
        #
        # Three arms, because every generated rule carries noDataState: OK
        # and /var/lib persists across boots, so both silence and staleness
        # are green by default. A check reading 0; a host that is scraped
        # but publishes no check at all; and a file whose mtime stopped
        # advancing while its contents still read 1. The third is the one a
        # writer that died at the wrong moment produces.
        #
        # The name claims only what was checked. HostKernelUnsafe would
        # claim the whole class.
        #
        # The first arm is `max(1 - check) > 0` and not the obvious
        # `min(check) == 0` because a Prometheus comparison returns the LEFT
        # side's value: `min(check) == 0` fires here with the value *zero*,
        # and alerts-gen puts a boolean expression whole into the Grafana
        # query and conditions it on "above 0", so the Grafana-managed copy
        # of this rule would never have fired on a failing check -- the one
        # arm that matters most. Measured, not reasoned:
        # promql_expr_test in alerts_test.yaml asserts both values.
        expr: |
          (max by (host_id, check) (1 - repose_kernel_check) > 0)
          or (max by (host_id) (up{job="hosts"}) == 1 unless on (host_id) (max by (host_id) (repose_kernel_check)))
          or (time() - max by (host_id) (node_textfile_mtime_seconds{file=~".*repose_kernel\\.prom"}) > 3600)
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "a kernel assertion on host {{ $labels.host_id }} failed, is missing or is stale"
          description: "This host's boot is not the boot the configuration asks for, or nothing is checking. Drain it; the fix is a reboot the owner runs, and the parameters only take on boot. Silence this in Grafana until that reboot rather than changing the rule. `cat /var/lib/node_exporter/textfile/repose_kernel.prom` on the host says which check."
          runbook: "docs/ops/RUNBOOK.md#hostkernelassertfailed"

      - alert: PoolHigh
        # The plan's disk counts what volumes hold, not their sizes, so
        # the pool is overcommitted by design (DECISIONS I-585, I-586). At
        # 70 percent used the api stops placing new projects on the host
        # and hostd sends pool_high; the guests already there keep growing
        # into the rest. A human grows the disk before PoolFull.
        expr: 1 - repose_host_pool_free_bytes / repose_host_pool_bytes > 0.7
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "thin pool on {{ $labels.host_id }} is over 70 percent full; no new projects go there"
          description: "{{ $value | humanizePercentage }} of vg-guests/thin is used. Grow the data disk before it reaches 85, where creates, restores and grows are refused."
          runbook: "docs/ops/RUNBOOK.md#poolhigh"

      - alert: PoolMetadataHigh
        # Thin pool metadata running out fails every volume's writes the
        # way data does, and it can fill before the data does (I-586).
        expr: repose_lvm_pool_metadata_percent > 80
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "thin pool metadata on {{ $labels.host_id }} is over 80 percent"
          description: "{{ $value }} percent of vg-guests/thin's metadata is used. hostd refuses creates at 85 and starts at 95."
          runbook: "docs/ops/RUNBOOK.md#poolmetadatahigh"

      - alert: PoolFull
        # A full thin pool means every guest's writes fail at once, so this
        # pages: guests are not down yet, but they are about to be.
        expr: repose_host_pool_free_bytes / repose_host_pool_bytes < 0.1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "thin pool on {{ $labels.host_id }} is over 90 percent full"
          description: "{{ $value | humanizePercentage }} of vg-guests/thin is free. Autoextend has run out of PV or the disk needs growing."
          runbook: "docs/ops/RUNBOOK.md#poolfull"

      - alert: PoolUnavailable
        # The thin pool cannot serve guest volumes: inactive after a host
        # reboot, missing, or failed (DECISIONS I-643, I-644). On
        # 2026-10-10 it stayed down for 9 hours and nothing said so. Every
        # start on the host answers volume_unavailable meanwhile, and
        # nothing new is placed there.
        expr: repose_host_pool_available == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "the guest pool on {{ $labels.host_id }} is unavailable"
          description: "vg-guests/thin cannot serve volumes; no machine on this host can start. journalctl -u repose-guest-pool -b says why."
          runbook: "docs/ops/RUNBOOK.md#poolunavailable"

      - alert: PoolUnmonitored
        # dmeventd does not watch the pool, so autoextend never runs and the
        # pool fills to PoolFull without growing (I-643). After the
        # 2026-10-10 reboot it was unmonitored for a day: lvm2-monitor ran
        # before the pool was active, and the lvm on PATH had no dmeventd.
        expr: repose_lvm_pool_monitored == 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "dmeventd does not monitor the guest pool on {{ $labels.host_id }}"
          description: "vg-guests/thin is not monitored, so it will not autoextend at 80 percent."
          runbook: "docs/ops/RUNBOOK.md#poolunmonitored"

      - alert: StoreFull
        # The host's root filesystem holds /nix/store, which every guest
        # reads over virtio-fs. A full store fails builds and, worse, a
        # `nix-collect-garbage` that races a create.
        expr: |
          1 - (
            node_filesystem_avail_bytes{job="hosts",mountpoint="/",fstype!~"tmpfs|ramfs"}
            / node_filesystem_size_bytes{job="hosts",mountpoint="/",fstype!~"tmpfs|ramfs"}
          ) > 0.85
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "root filesystem on {{ $labels.host_id }} is over 85 percent full"
          description: "{{ $value | humanizePercentage }} used. The store is the usual cause; check the per-project closure cap before deleting anything."
          runbook: "docs/ops/RUNBOOK.md#storefull"

      - alert: GuestdLost
        # A guest whose guestd is unreachable still runs, but it cannot be
        # frozen for a snapshot, resized, or told to switch, and its samples
        # stop. The count is the metric; which guest it is comes from the
        # guestd_lost log line in Loki (guest_id is never a label).
        expr: repose_host_guestd_lost > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} guest(s) on {{ $labels.host_id }} have lost guestd"
          description: "No vsock connection for over a minute. Snapshots, resize and config apply are blocked for those guests."
          runbook: "docs/ops/RUNBOOK.md#guestdlost"

      - alert: BuildQueueStuck
        # hostd runs at most two builds at once (DECISIONS R5-4). Two
        # running with nothing completing for 45 minutes is a build that will
        # not finish inside its 30-minute cap, which means the cap is not
        # being enforced.
        expr: |
          repose_host_builds_running >= 2
          unless on (instance)
          sum by (instance) (increase(repose_host_build_duration_seconds_count[45m])) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "build queue on {{ $labels.host_id }} has not completed a build in 45 minutes"
          description: "Both build slots are busy and no build has finished. A build past its 30-minute cap is not being killed."
          runbook: "docs/ops/RUNBOOK.md#buildqueuestuck"

      - alert: HostdDown
        # Prometheus cannot scrape hostd over the edge's WireGuard: the host
        # is down, its network is dead, or hostd is. HostUnreachable cannot
        # see the second of those (it only counts host-to-api heartbeats
        # over the VNet) and fires late or never for the others; on
        # 2026-10-10 it never fired. This is the page for a host; the
        # inhibitions used to keep it to one; Grafana has none, so read
        # docs/ops/OBSERVABILITY.md's table of which alert causes which.
        expr: up{job="hostd"} == 0
        for: 3m
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot reach hostd on {{ $labels.host_id }}"
          description: "No scrape of :9101 over WireGuard for 3 minutes. The host, its network or hostd is down; its guests may be down with it."
          runbook: "docs/ops/RUNBOOK.md#hostddown"

      - alert: HostWgDown
        # The host is alive and its tunnel to the edge is not. hostd's
        # heartbeat reaches the api over the provider NIC and this scrape
        # comes through the edge over WireGuard, so a dead or one-way
        # tunnel takes the scrape and leaves the heartbeat: the api still
        # has the host `ready` while the gateway cannot dial a single
        # guest on it, Fluent Bit ships nothing, and the host's sshd,
        # which binds the WireGuard address and nothing else, cannot be
        # reached at all.
        #
        # RUNBOOK has had a HostWgDown section since the alert was
        # specified and no rule ever carried it, so on 2026-11-10 host-02
        # spent 42 minutes in this state and what fired was HostdDown and
        # HostScrapeDown, both naming hostd, which was healthy throughout
        # (DECISIONS I-1070). HostScrapeDown's runbook link already points
        # at that section.
        #
        # The api NOT seeing the host unreachable is what separates this
        # from a host that is simply down; with api-grpc dead the gauge
        # has no series at all and this cannot fire, which is
        # ApiHostsAbsent's job rather than this one's. HostdDown is left
        # as the catch-all page it was built to be (it is the only alert
        # that saw 2026-10-10), so both fire together and this one names
        # the cause; OBSERVABILITY.md's table is where that is written
        # down, Grafana having no inhibitions (I-942).
        # Written as a product rather than the obvious
        #   up{job="hostd"} == 0 and on (host_id) (... == 0)
        # on purpose. A Prometheus comparison returns the LEFT side's
        # value, so that form fires with the value zero, and alerts-gen
        # cannot split a boolean top level: the Grafana copy would get the
        # whole expression with a condition of "above 0" and could never
        # fire (I-1012 and ops/grafana/alerts-gen.py's BOOLEAN_EXPRS, which
        # ops/check.sh refuses to let this join without that being true).
        # `1 - up` is 1 for a failed scrape, `== bool 0` is 1 for a host
        # the api does not hold unreachable, and the product is 1 only when
        # both are, so the firing value is 1 and the condition splits. With
        # api-grpc publishing no host states the group_left finds no match,
        # the series is dropped and this cannot fire at all, which is
        # ApiHostsAbsent's job.
        expr: |
          max by (host_id) (
            (1 - up{job="hostd"})
              * on (host_id) group_left()
                (max by (host_id) (repose_api_host_state{state="unreachable"}) == bool 0)
          ) > 0
        # Longer than HostdDown's 3m on purpose, and the number is the
        # watchdog's (I-1068), not a guess. A break at T is detected by
        # repose-wg-watchdog between T+180 s and T+240 s, it rebinds the
        # socket, and a rebind that works is scraped as recovered inside
        # another half minute. So 8m pages only once self-repair has been
        # tried and has had five minutes to prove it worked, which is what
        # makes this page actionable rather than a race with its own fix.
        # Nothing is silent in the meantime: HostdDown still pages at 3m
        # as the catch-all, and on a host whose watchdog is off or absent
        # this simply pages five minutes later than it otherwise would.
        for: 8m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.host_id }} is heartbeating but its tunnel to the edge is down"
          description: "The api can reach this host and Prometheus cannot scrape it through the edge, so the WireGuard tunnel is down or one-way. Its guests keep running and no `repose ssh`, `run`, `attach` or `open` reaches them; its logs and metrics stop; operator ssh to the host stops with them. repose_host_wg_rebinds_total says whether the host's own watchdog is already trying."
          runbook: "docs/ops/RUNBOOK.md#hostwgdown"

      - alert: HostServiceDown
        # A unit a host needs is not active. After the 2026-10-10 reboot
        # docker-registry was skipped on its mount condition and stayed
        # inactive for 36 hours with nothing saying so. A missing unit has
        # no series and does not fire (repose-guest-pool before I-643).
        expr: |
          node_systemd_unit_state{job="hosts",state="active",name=~"hostd\\.service|repose-guest-pool\\.service|repose-cache-volume\\.service|repose-npm-cache\\.service|docker-registry\\.service"} == 0
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.name }} is not active on {{ $labels.host_id }}"
          description: "systemd says {{ $labels.name }} has not been active for 15 minutes. Guests fall back to the public registries while a cache is down; hostd or the pool down means no guest starts."
          runbook: "docs/ops/RUNBOOK.md#hostservicedown"

      - alert: HostScrapeDown
        # docs/workstreams/10-observability.md §6: hostd keeps sampling into
        # Postgres over the gRPC stream, so billing data is not lost; what is
        # lost is every dashboard for that host.
        expr: up{job=~"hosts|hostd"} == 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.host_id }}"
          description: "The WireGuard tunnel or the exporter is down. Metering continues through the api stream; metrics and the host dashboards do not. Its own section's step 2 is the tunnel, which is HostWgDown."
          runbook: "docs/ops/RUNBOOK.md#hostscrapedown"

      - alert: FluentBitStuck
        # §6: Fluent Bit buffers to disk and retries forever, so failed
        # retries accumulating for half an hour is a host whose logs are
        # about to age out of a 1 GB buffer.
        expr: increase(fluentbit_output_retries_failed_total{job="fluent-bit"}[30m]) > 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "Fluent Bit on {{ $labels.host_id }} cannot ship to Loki"
          description: "Retries have been failing for 30 minutes. Chunks buffer to /var/lib/fluent-bit up to 1 GB, then the oldest are dropped."
          runbook: "docs/ops/RUNBOOK.md#fluentbitstuck"

      - alert: FluentBitLogShipperDown
        # FluentBitStuck only fires while Fluent Bit is running and
        # failing: a shipper that is not running emits no series at all,
        # so the loudest failure (no logs leaving the host) was the
        # quietest signal. That became the *expected* state for a host
        # with no Loki recorded when I-95 gave the unit an ExecCondition,
        # which is the right behaviour for the process and the wrong
        # thing to be silent about.
        expr: up{job="fluent-bit"} == 0
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "No log shipper on {{ $labels.host_id }}"
          description: "Fluent Bit is not answering. A host with no Loki recorded does not start it at all (repose-admin edge loki); otherwise the unit has failed. Either way this host's journald and guest console logs are going nowhere."
          runbook: "docs/ops/RUNBOOK.md#fluentbitlogshipperdown"

  - name: repose-control-plane
    interval: 1m
    rules:
      - alert: HostUnreachable
        # The api marks a host unreachable after 90 seconds without a
        # heartbeat (DESIGN §9). Its guests may still be running, but no
        # command reaches them, so this pages.
        #
        # One alert per host, from repose_api_host_state (I-786).
        # repose_api_hosts counts states and names no host, so this fired
        # once for a fleet and said "2 host(s)": the operator could not
        # tell which, and Alertmanager could not hold it back behind the
        # right host's HostdDown, so on a two-host fleet one host's scrape
        # failure suppressed the other host's page. max by (host_id)
        # keeps it one series per host whatever publishes the gauge (the
        # host sweep runs in api-grpc, so today that is one target).
        expr: max by (host_id) (repose_api_host_state{state="unreachable"}) == 1
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.host_id }} is unreachable from the api"
          description: "No heartbeat for over 90 seconds. Placements are already refused; guests on that host cannot be started, stopped or snapshotted."
          runbook: "docs/ops/RUNBOOK.md#hostunreachable"

      - alert: ApiDown
        # Either api process stops answering its scrape. A dead api-grpc
        # also silences HostUnreachable, which is computed from its gauge
        # (DECISIONS I-648).
        #
        # `up{job="api"}` is not this server's scrape since I-960: Alloy on
        # the control VM scrapes the api container over the Docker network
        # and forwards the `up` its own scrape generates. So this still
        # fires when the api is down, and does NOT fire when Alloy is --
        # the series stops arriving rather than reaching 0, which is
        # AlloyDown's job and ApiMetricsAbsent's.
        expr: up{job=~"api|api-grpc"} == 0
        for: 3m
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }}"
          description: "No scrape for 3 minutes. If it is api, users cannot log in, create or start; if api-grpc, hosts have no stream and nothing is placed, started or stopped."
          runbook: "docs/ops/RUNBOOK.md#apidown"

      - alert: AlloyDown
        # The collector that carries the api's ~57 series. It pushes, so
        # Prometheus cannot tell its silence from a quiet fleet -- which is
        # exactly why this server scrapes Alloy itself (I-960). While it is
        # down ApiErrors, the gate-refusal panel and BillingWebhookErrors
        # have no input and cannot fire, so the loss is of sight, not of
        # service: tenants are unaffected and nothing is queued or dropped.
        # Warn, not page, for that reason.
        expr: up{job="alloy"} == 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "the control VM's Alloy is not answering its scrape"
          description: "The api's metrics stop arriving while this holds; the api itself is unaffected. In Coolify, project repose, the `alloy` service: check it is running and that its port is published on 10.255.255.1 and not elsewhere. `docker logs` on the control VM names a config error."
          runbook: "docs/ops/RUNBOOK.md#alloydown"

      - alert: ApiMetricsAbsent
        # Alloy is up and no api series are arriving. The reason worth
        # writing down: Alloy finds the api container by the application
        # uuid inside its container name, because Coolify's names are not
        # stable and a custom Docker label would hand it ALL label handling
        # (I-960). If that application is deleted and recreated its uuid
        # changes, the match keeps nothing, and Alloy runs perfectly while
        # scraping no targets. That failure is silent without this rule --
        # the same shape as a dead datasource reading healthy (I-944) and
        # closure-equiv answering "unchanged" (I-958).
        #
        # absent(), not == 0: a scrape that fails gives up == 0 and is
        # ApiDown's. This is the series not being there at all, which also
        # catches remote_write being refused and the receiver flag being
        # off.
        expr: absent(up{job="api"})
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "no api metrics have arrived for 15 minutes"
          description: "Alloy is scraping nothing, or its writes are refused. Check Alloy's own targets at http://10.255.255.1:12345 (it is scraped as job=alloy); then that the api application's uuid still matches the regex in ops/alloy/config.alloy; then that Prometheus still runs with --web.enable-remote-write-receiver and the edge still allows 9090 (I-952)."
          runbook: "docs/ops/RUNBOOK.md#apimetricsabsent"

      - alert: GatewayDown
        # The edge's gateway stops answering its scrape: nobody can SSH to
        # a machine. The edge VM's network function has been revoked three
        # times (Sep 26, Sep 27, Oct 3).
        expr: up{job="gateway"} == 0
        for: 3m
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape the gateway on the edge"
          description: "No scrape of the edge's :9102 for 3 minutes. Either the edge, its WireGuard or the gateway is down; users' ssh, run and attach fail while it is."
          runbook: "docs/ops/RUNBOOK.md#gatewaydown"

      - alert: GatewayCachesStale
        # The gateway is up and relaying, so GatewayDown and
        # MonitoringPathDown stay quiet, and it cannot reach the api: at
        # StaleAfter (1 h) it refuses every new connection and nobody can
        # ssh, run, attach or open. On 2026-10-26 the control VM's tunnel
        # died one way and this gauge climbed for 9 hours with nothing
        # watching it; ApiDown reads the same tunnel, so it is not the
        # second opinion it looks like (DECISIONS I-870).
        expr: repose_gateway_revocation_cache_age_seconds > 900
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The gateway has not reached the control plane for 15 minutes"
          description: "The gateway's revocation list is older than 15 minutes. It still relays existing sessions, and at one hour it refuses every new ssh, run, attach and open with 'gateway cannot reach control plane'."
          runbook: "docs/ops/RUNBOOK.md#gatewaycachesstale"

      - alert: MonitoringPathDown
        # Prometheus reaches the gateway, every hostd and both api
        # processes through the edge's WireGuard, so a dead edge, a dead
        # edge network function (revoked Sep 26, Sep 27, Oct 3) or a dead
        # tunnel fails them all at once. This is the one page for that; it
        # fires a minute before GatewayDown, HostdDown and ApiDown so its
        # inhibition used to hold them back; Grafana has none, so it is
        # first in OBSERVABILITY.md's cause-and-consequence table.
        expr: sum(up{job=~"gateway|hostd|api|api-grpc"}) == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape anything through the edge"
          description: "The gateway, every hostd and both api processes have failed their scrapes for 2 minutes. The edge VM, its network or the WireGuard tunnel to this server is down; GatewayDown, HostdDown and ApiDown are held back behind this page."
          runbook: "docs/ops/RUNBOOK.md#monitoringpathdown"

      - alert: ApiHostsAbsent
        # The api's host gauges are what HostUnreachable, HostUnregistered
        # and HostNotInTargets read. When they are gone (api-grpc down, or
        # its scrape broken) those alerts are silent, not quiet; this says
        # so. Both families are checked: repose_api_hosts exists even with
        # an empty hosts table, so it catches a dead scrape, and
        # repose_api_host_state is the per-host family three rules now
        # depend on, so a deploy that drops it is caught too (I-786).
        expr: absent(repose_api_hosts) or absent(repose_api_host_state)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "the api's host gauges are missing, so no host alert from the api can fire"
          description: "Prometheus has had no repose_api_hosts or repose_api_host_state series for 5 minutes. HostUnreachable, HostUnregistered and HostNotInTargets are silent until api-grpc is scraped again."
          runbook: "docs/ops/RUNBOOK.md#apihostsabsent"

      - alert: HostNotInTargets
        # The same silence for a whole host. Every host alert is scoped to
        # the targets in ops/prometheus/targets/hosts.yml, which is copied
        # to this server by hand (ops/README.md step 2) and not by the
        # apply that creates the host, so a new host carries tenants with no
        # series at all: PoolFull, StoreFull, HostdDown and the rest are
        # silent on a host the file does not list.
        #
        # By id, not by count (I-786). The first version of this rule
        # compared `count(up{job="hostd"} == 1)` with the api's count of
        # ready hosts, and a count hides exactly the case it was written
        # for: one stale entry for a retired host answers for the new one,
        # the two numbers match, and the unmonitored host stays silent. The
        # api knows every host by id, so compare the ids.
        #
        # The right side is `count by (host_id) (up{job="hostd"})`, not
        # `up == 1`: a listed host whose scrape is failing *has* a target,
        # and that is HostdDown's alert, not this one. Comparing against
        # successful scrapes instead would turn one dead tunnel into one
        # of these per host, on top of MonitoringPathDown.
        #
        # 15m covers the gap between a registration and the copy.
        expr: |
          max by (host_id) (repose_api_host_state{state="ready"}) == 1
          unless on (host_id) count by (host_id) (up{job="hostd"})
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.host_id }} is ready and Prometheus has no hostd target for it"
          description: "The api has this host ready and no entry in /etc/prometheus/repose/targets/hosts.yml carries its host_id, so PoolFull, StoreFull, HostdDown and every other alert scoped to that file is silent on it, and on the tenants it carries."
          runbook: "docs/ops/RUNBOOK.md#hostnotintargets"

      - alert: HostUnregistered
        # A host the api created and nothing ever registered. The row
        # exists from the moment `repose-admin hosts add` mints the join
        # token, which is before the apply that installs the machine, and
        # it leaves `registering` only when hostd presents that token.
        #
        # This is the one host failure no other rule can see. Every other
        # per-host signal comes from the host's own exporters, and a host
        # that never arrived has none to scrape: on 2026-10-26 host-02 was
        # created and sat unregistered for 16 h 56 m with no alert of any
        # kind, and the owner learnt of it from an unrelated outage. The
        # api's own hosts table is the only thing that knows the host
        # exists, so this reads that, by id, and needs nothing copied to
        # the monitoring server.
        #
        # 30m: adding a host takes about ten minutes (infra/README.md
        # "Adding a host"), so half an hour is past a normal install and
        # well short of the token's 24-hour life.
        expr: max by (host_id) (repose_api_host_state{state="registering"}) == 1
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.host_id }} has not registered"
          description: "The api has had this host in registering for 30 minutes: no hostd has presented its join token, so nothing is placed on it. For a new host that is a machine that was created and never arrived; for one already running it is a reissued token nothing has used."
          runbook: "docs/ops/RUNBOOK.md#hostunregistered"

      - alert: BootSlow
        # Most creates and starts on a host took over 2 minutes (DECISIONS
        # I-707). A busy host boots in 30 to 70 s (2026-10-13 on host-01,
        # I-704), so a 30 s line would fire all day; past 2 minutes a boot
        # is close to the 3-minute setup bound (I-705) and about to fail.
        # Two boots at least, so one stuck tenant is not a host problem.
        expr: |
          (
            sum by (job, instance, host_id) (increase(repose_host_command_duration_seconds_count{kind=~"CreateGuest|StartGuest"}[30m]))
              - sum by (job, instance, host_id) (increase(repose_host_command_duration_seconds_bucket{kind=~"CreateGuest|StartGuest",le="120"}[30m]))
          )
            / sum by (job, instance, host_id) (increase(repose_host_command_duration_seconds_count{kind=~"CreateGuest|StartGuest"}[30m]))
            > 0.5
          and
            sum by (job, instance, host_id) (increase(repose_host_command_duration_seconds_count{kind=~"CreateGuest|StartGuest"}[30m]))
            > 1.5
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "most creates and starts on {{ $labels.host_id }} took over 2 minutes"
          description: "Share of the last 30 minutes' boots over 2 minutes: {{ $value | humanizePercentage }}."
          runbook: "docs/ops/RUNBOOK.md#bootslow"

      - alert: SnapshotStale
        # Nightly at 03:00 plus one on every stop (DESIGN §6), so 36 hours
        # without one means two schedules have been missed.
        expr: repose_api_snapshot_age_seconds > 36 * 3600
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "a running project has no snapshot for over 36 hours"
          description: "Oldest last-snapshot is {{ $value | humanizeDuration }}. A host loss now loses up to that much of a tenant's work."
          runbook: "docs/ops/RUNBOOK.md#snapshotstale"

      - alert: GatewayAuthSpike
        # One failure a second, sustained, is not a user with a stale
        # certificate; it is a scan or a bug in the CLI's refresh.
        expr: sum by (instance) (rate(repose_gateway_auth_fail_total[5m])) > 1
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "gateway is refusing over one login a second"
          description: "Break it down by reason: bad_cert and not_found are a scan, expired and revoked are the CLI's refresh path."
          runbook: "docs/ops/RUNBOOK.md#gatewayauthspike"

      - alert: EgressHigh
        # The api recomputes this hourly from meter_samples, because a
        # per-project series in Prometheus is the label this design refuses
        # (§5). Over a terabyte a day is not a build cache.
        expr: repose_api_egress_alert_projects > 0
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} project(s) sent over 1 TB in 24 hours"
          description: "Find them on the Abuse dashboard's egress panel, then the runbook's Suspend a user."
          runbook: "docs/ops/RUNBOOK.md#egresshigh"

      - alert: RollupLag
        # usage_hours is what invoices are built from; two hours behind is
        # the point at which a month-end close would be wrong.
        expr: repose_api_rollup_lag_seconds > 2 * 3600
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "usage rollup is {{ $value | humanizeDuration }} behind"
          description: "meter_samples are arriving but usage_hours is not being written. Invoices are built from usage_hours."
          runbook: "docs/ops/RUNBOOK.md#rolluplag"

      - alert: PartitionDropFail
        # docs/workstreams/10-observability.md §6: the sample tables' monthly
        # partitions are not being dropped, so Postgres grows and nothing
        # else breaks. It is only urgent on the way to a full disk.
        expr: increase(repose_api_partition_drop_fail_total[6h]) > 0
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "partition maintenance is failing"
          description: "{{ $value }} failed runs in six hours. meter_samples and proc_samples keep their old partitions; check the disk before it matters."
          runbook: "docs/ops/RUNBOOK.md#partitiondropfail"

      - alert: BillingWebhookRejected
        # 09-billing.md §5.11 (I-604): five deliveries in ten minutes failed
        # the Standard Webhooks signature check. Either someone is posting at
        # the endpoint, or POLAR_WEBHOOK_SECRET and the webhook endpoint have
        # drifted apart, in which case no subscription event is applied.
        expr: sum(round(increase(repose_api_billing_webhook_total{result="bad_signature"}[10m]))) >= 5
        for: 0m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} Polar webhook deliveries rejected in ten minutes"
          description: "Check POLAR_WEBHOOK_SECRET against the webhook endpoint's secret in Polar's dashboard. While this fires, subscription and payment events are not being applied."
          runbook: "docs/ops/RUNBOOK.md#billingwebhookrejected"

      - alert: OverageChargeFailed
        # An egress overage line was recorded but Polar refused the event
        # ingest. The row stays without a sent_ref and the next tick sends it
        # again under the same external id (I-604).
        expr: increase(repose_api_billing_overage_charges_total{result="error"}[1h]) > 0
        for: 0m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} egress overage charge(s) failed in the last hour"
          description: "`repose-admin billing show <handle>` names the line. The next hourly tick sends it again under the same external id; an event Polar receives after the period's end lands on the next renewal order."
          runbook: "docs/ops/RUNBOOK.md#overagechargefailed"

      - alert: BillingStopped
        # The api stopped a tenant's machines by itself for billing: three
        # days past due, a subscription that ended, or the egress ceiling.
        # Nothing to fix; a human should know it happened.
        expr: sum by (reason) (increase(repose_api_billing_stops_total[1h])) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "machines stopped for billing ({{ $labels.reason }})"
          description: "{{ $value }} machine(s) stopped in the last hour, reason {{ $labels.reason }}. `repose-admin billing show <handle>` shows the account; nothing is deleted for 30 days."
          runbook: "docs/ops/RUNBOOK.md#billingstopped"

      - alert: SamplesFailing
        # The api stores each guest's sample rows apart (I-446). A guest
        # whose rows were refused is stored with the host-measured fields
        # only (reason guest_fields); insert means nothing was stored for
        # it, so its minute is a billing gap.
        expr: sum by (reason) (increase(repose_api_samples_failed_total[15m])) > 0
        for: 0m
        labels:
          severity: warn
        annotations:
          summary: "guest samples were not stored as sent ({{ $labels.reason }})"
          description: "{{ $value }} guest sample(s) in 15 minutes. Loki `{component=\"api\"} | json | event=\"samples_fail\"` names the host, the project and the Postgres error."
          runbook: "docs/ops/RUNBOOK.md#samplesfailing"

      - alert: NotifyFailing
        # Notifications stopped reaching users (DECISIONS I-691): email
        # sends failing for good, or due rows nobody picks up. Only email
        # counts: an ntfy failure is the user's own server (a reserved
        # topic, a 404, a private address) and nothing we can fix, and a
        # Google Chat webhook is the user's own too: a deleted one marks
        # the channel broken and mails the user (I-692). Before it, a
        # revoked Resend key would have failed every queued email with no
        # alert. The lag is how long the oldest due row has waited for the
        # worker; a held or retrying row is not due, so neither counts.
        expr: |
          sum(increase(repose_api_notify_total{result="failed",channel="email"}[10m])) > 0
            or max(repose_api_outbox_lag_seconds) > 300
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "notifications are failing or not being sent"
          description: "Failed email sends in each of the last 10 minutes, or a due outbox row older than 5 minutes ({{ $value }}). Loki `{component=\"api\"} | json | event=\"notify_fail\"` names the channel and kind."
          runbook: "docs/ops/RUNBOOK.md#notifyfailing"

      - alert: HostReportsRefused
        # A host reported a guest of a project placed elsewhere, or a
        # snapshot outside the project's prefix (I-447). hostd never does
        # either, so this is a bug in a reconcile or a host to look at.
        expr: sum by (reason) (increase(repose_api_host_reports_refused_total{reason=~"foreign_guest|bad_snapshot"}[15m])) > 0
        for: 0m
        labels:
          severity: warn
        annotations:
          summary: "the api dropped host reports ({{ $labels.reason }})"
          description: "{{ $value }} report(s) in 15 minutes. Loki `{component=\"api\"} | json | event=~\"foreign_guest|snapshot_done\"` names the host and the guest."
          runbook: "docs/ops/RUNBOOK.md#hostreportsrefused"

      - alert: ResumeStalled
        # Machines a host restart stopped that the api has neither started
        # nor closed for 20 minutes (DECISIONS I-645): the tick is not
        # running, REPOSE_RESUME=off was left on, the host's pool is down,
        # or starts keep failing on capacity. Their owners are waiting. Only
        # the replica running the tick sets the gauge; max covers both.
        expr: max(repose_api_guest_resumes_pending) > 0
        for: 20m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} machine(s) stopped by a host restart are still not started"
          description: "`select p.slug, g.outcome, g.reason, g.created_at from guest_resumes g join projects p on p.id = g.project_id where g.decided_at is null` lists them; Loki `{component=\"api\"} | json | event=\"guest_resume\"` says what each tick did."
          runbook: "docs/ops/RUNBOOK.md#resumestalled"

      - alert: ResumeNotStarted
        # hostd has guests a host restart interrupted, under 6 h old and not
        # running, for 30 minutes (DECISIONS I-645). This catches rows the
        # api never wrote (an api down since the reboot, an old api). Not a
        # page: a machine its owner stopped meanwhile, or one the rules
        # refused, keeps its mark until the 6 h pass.
        expr: max by (host_id) (repose_host_guests_interrupted) > 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} guest(s) on {{ $labels.host_id }} were interrupted by a host restart and have not run since"
          description: "`hostd guests --json | jq '.[] | select(.interrupted_boot_id)'` on the host lists them; compare with guest_resumes for that boot."
          runbook: "docs/ops/RUNBOOK.md#resumenotstarted"

      - alert: GuestNotParked
        # A park left a running guest's memory unsaved, so a host
        # restart cold-boots it and everything it was running is gone:
        # agents, tmux windows, open files (DECISIONS I-652, I-796). On
        # 2026-10-18 host-01's xl guest was skipped by the estimate, cold
        # booted, and nothing alerted; the owner found out because a test
        # happened to have a probe inside the guest. `reason` says which
        # path left it: estimate (its snapshot would have outlasted the
        # deadline, so raise repose.host.park.deadline or measure
        # writeRateMBs again), deadline, no_room (the thin pool), failed,
        # no_key (Key Vault) or busy.
        #
        # A shutdown park's own counter is never scraped, because the
        # host goes down behind it, so the count hostd publishes is the
        # host's running total, read at each start from the tally beside
        # its park records: the rise this alert sees is usually in the
        # first minutes of the new boot. The total has to be cumulative
        # for this expression to work at all -- a per-boot count would
        # read 1, 1, 1 for the same guest skipped at every reboot, and
        # increase() sees a repeat as no rise (I-796). 6 h is I-645's
        # window, which is also how long the image would have been kept,
        # and it is what makes the alert clear by itself. Not a page: the
        # loss has already happened and the remedy is a human decision
        # (a longer deadline, a less loaded host, another host).
        expr: |
          sum by (host_id, reason) (increase(repose_host_guest_park_skipped_total[6h])) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} guest(s) on {{ $labels.host_id }} were not parked ({{ $labels.reason }}) and lost what they were running"
          description: "Loki `{component=\"hostd\"} | json | event=\"guest_park\"` names each guest and the reason; `journalctl -b -1 -u repose-guest-park -u hostd` has the park that did it. Compare the park's duration with repose.host.park.deadline before raising it."
          runbook: "docs/ops/RUNBOOK.md#guestnotparked"

      - alert: GuestImageDiscarded
        # The other half of the same loss (DECISIONS I-652, I-796). A
        # guest the park did save, whose image the next start could not
        # give back, cold boots with its agents gone exactly as a guest
        # the park skipped does. `reason` says what the image ran into:
        # incomplete (never finished, so hostd was killed mid-snapshot --
        # check GuestNotParked and the park unit's stop timeout),
        # too_old (the host was down past the 6 h window), changed (the
        # guest's closure, class or volume moved under the image while
        # the host was down, so it could not be trusted), no_key (Key
        # Vault), failed (the restore itself) or window (the unpark ran out
        # of time; raise repose.host.park.restoreTimeout).
        #
        # Published as a running total for the same reason as the park
        # half: an unpark runs before the metrics listener is up, so the
        # first scrape of a boot already has the loss in it.
        expr: |
          sum by (host_id, reason) (increase(repose_host_guest_unpark_discarded_total[6h])) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} guest(s) on {{ $labels.host_id }} lost their parked memory at the unpark ({{ $labels.reason }})"
          description: "Loki `{component=\"hostd\"} | json | event=\"guest_unpark\"` names each guest and what its image ran into; `parked guests restored` carries `restored`, `images` and `duration_ms`. A whole boot's images discarded at once is the host, not the guests."
          runbook: "docs/ops/RUNBOOK.md#guestimagediscarded"

      # The launch window's rules (DECISIONS I-800). Each reads a counter
      # that already incremented and had no alert: the audit before launch
      # found five such families, which is instrumentation that costs the
      # same as none. The thresholds are set for a fleet of tens of
      # projects; each rule's RUNBOOK heading says what to raise it to
      # when the volume grows.
      - alert: ApiErrors
        # A 5xx is the user's create, start or attach failing. Per route,
        # because one broken route hides inside a healthy total. The
        # window is long and the share low: at launch volume a handful of
        # requests a minute makes any rate jumpy, so the `for` does the
        # smoothing the rate cannot.
        expr: |
          sum by (route) (rate(repose_api_requests_total{status=~"5.."}[10m]))
            / sum by (route) (rate(repose_api_requests_total[10m])) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "api route {{ $labels.route }} is answering {{ $value | humanizePercentage }} 5xx"
          description: "Loki `{component=\"api\"} | json | status >= 500` has the request_id and the route. /healthz answering 503 is Postgres or a migration, not the route."
          runbook: "docs/ops/RUNBOOK.md#apierrors"

      - alert: OpsFailing
        # An op that ends in `error` is a machine a user asked for and did
        # not get. One is worth reading at this size; the heading says to
        # raise the threshold rather than widen the window, because a
        # create that fails for every user and a create that fails for one
        # look the same in a share.
        expr: sum by (kind) (increase(repose_api_ops_total{state="error"}[30m])) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} {{ $labels.kind }} op(s) ended in error"
          description: "`repose-admin ops list --state error` then `ops log <id>`; the op's error field carries the phase that failed. A create failing after CreateGuest leaves a volume the destroy path reclaims."
          runbook: "docs/ops/RUNBOOK.md#opsfailing"

      - alert: ScheduleRefused
        # A seat sold and not delivered: the subscription holds its memory
        # and the fleet would not place the guest. `no_capacity` and
        # `no_cpu` are different purchases (I-736) -- memory buys a bigger
        # host, cores buy more of them -- so the reason is in the label and
        # in the summary. `error` is a bug in placement, not a full fleet.
        expr: sum by (result) (increase(repose_api_schedule_total{result=~"no_capacity|no_cpu|error"}[15m])) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} placement(s) refused: {{ $labels.result }}"
          description: "A paying user cannot start a machine. `repose-admin seats` says which ceiling the fleet is against and the Host capacity dashboard says which host; the OpenTofu apply for another host is the owner's. Capacity, not a crash: the api answered 503 with capacity, and the op can be retried once a host is ready."
          runbook: "docs/ops/RUNBOOK.md#schedulerefused"

      - alert: GatewayDialFailing
        # The gateway reaching sshd is the product: a user whose `repose
        # attach` cannot dial has no machine, however healthy the guest.
        # The counter carries no reason, so the log line is the next step.
        expr: sum(increase(repose_gateway_dial_fail_total[10m])) > 3
        for: 5m
        labels:
          severity: page
          service: gateway
        annotations:
          summary: "the gateway failed {{ $value }} dials to guest sshd in ten minutes"
          description: "Loki `{component=\"gateway\"} | json | event=\"dial_fail\"` has the project. All projects at once is the WireGuard path or wgsync (check repose_gateway_wgsync_errors_total); one project is its guest's sshd."
          runbook: "docs/ops/RUNBOOK.md#gatewaydialfailing"

      - alert: SnapshotFailing
        # SnapshotStale reads the api's backstop gauge, which the expiry
        # job refreshes on a 24-hour ticker, so a snapshot that fails now
        # is invisible for up to that long plus the alert's window. The
        # histogram's count is observed by the failing path itself
        # (snapshot.go), so this fires within the hour.
        expr: sum by (host_id, result) (increase(repose_host_snapshot_duration_seconds_count{result!="ok"}[1h])) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} snapshot(s) on {{ $labels.host_id }} failed ({{ $labels.result }})"
          description: "A stop with no snapshot is a user's work left only on the volume. Loki `{component=\"hostd\"} | json | event=\"snapshot\"` names the guest and the code; `repose-admin ops list --kind snapshot` has the op."
          runbook: "docs/ops/RUNBOOK.md#snapshotfailing"

      - alert: BillingWebhookErrors
        # Paid and not applied. BillingWebhookRejected covers the secret
        # drifting (`bad_signature`); this covers the delivery that
        # arrived, was trusted and could not be stored, which leaves a
        # subscription Polar believes in and the api does not.
        #
        # Deliberately absolute, not an increase(): the first error of a
        # kind arrives as a brand-new series at 1, which increase() over
        # any window can read as no rise. It therefore stays firing until
        # an operator reconciles the account and silences it with a
        # comment (`amtool silence add`), which is the point -- a dropped
        # subscription event does not heal.
        expr: sum(repose_api_billing_webhook_total{result="error"}) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} Polar webhook deliver(ies) failed to apply"
          description: "Loki `{component=\"api\"} | json | event=\"webhook_received\" | result=\"error\"` has the kind, never the body. Reconcile the account against Polar's dashboard with `repose-admin billing show <handle>`, then silence this with a comment: it is absolute and will not clear by itself."
          runbook: "docs/ops/RUNBOOK.md#billingwebhookerrors"

      - alert: BillingGap
        # usage_hours is the ledger invoices are built from. A running
        # project with no sample for the hour is a hole in it: the rollup
        # writes the row with gap = true and the hour's egress and disk
        # are lost, which under-bills the account and hides an abuser.
        # An hour of one project's minutes is the tolerance.
        # sum, not max: the rollup runs on whichever replica wins the
        # advisory lock, so each replica's counter holds the gaps it
        # personally rolled up and the two are disjoint.
        expr: sum(increase(repose_api_billing_gap_minutes_total[1h])) > 60
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} project-minutes of the last hour had no meter sample"
          description: "Loki `{component=\"api\"} | json | event=\"billing_gap\"` names the project and the hour. One project is its guestd (check repose_host_guestd_lost); every project on a host is the host's stream (repose_host_stream_connected)."
          runbook: "docs/ops/RUNBOOK.md#billinggap"

      - alert: ControlDiskFull
        # Postgres is on this disk. A full one stops starts, samples and
        # invoices at once, and every symptom reads as something else: the
        # api answers 503, the rollup fails, RollupLag rises. 85 percent on
        # a VM nobody logs into is weeks of warning, so this is a warn that
        # should never become a page.
        expr: |
          1 - (
            node_filesystem_avail_bytes{job="control-node",fstype!~"tmpfs|ramfs|overlay"}
            / node_filesystem_size_bytes{job="control-node",fstype!~"tmpfs|ramfs|overlay"}
          ) > 0.85
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "the control VM's {{ $labels.mountpoint }} is over 85 percent full"
          description: "Postgres, the api images and Coolify's build cache share this disk. `docker system prune` and the sample tables' partitions (repose_partitions_maintain) are the two things that free space; the partitions are dropped hourly by the api, so a disk filling with them means PartitionDropFail is also firing."
          runbook: "docs/ops/RUNBOOK.md#controldiskfull"

      - alert: GuestWakeFailed
        # A frozen guest (DECISIONS I-818) that would not resume. Its
        # memory and processes are intact, but nothing the user does
        # reaches the machine until a wake succeeds, so this is a tenant
        # blocked on a machine the dashboard still calls running. `reason`
        # is the step that failed: resume (vm.resume never left the VM
        # Running), guestd (no answer after the resume) or state (the
        # guest is no longer one that can be woken).
        # Not a page: the api and the gateway each retry a wake on the
        # next thing the user does, so a single failure that clears
        # itself is normal; a reason that keeps rising for 5 minutes is
        # the host.
        expr: |
          sum by (host_id, reason) (increase(repose_host_guest_wake_failed_total[15m])) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} wake(s) of a frozen guest on {{ $labels.host_id }} failed ({{ $labels.reason }})"
          description: "Loki `{component=\"hostd\"} | json | event=\"guest_resting\"` names each guest and the phase it failed at. The guests are still running with their memory; `hostd guests --json` on the host lists which are resting."
          runbook: "docs/ops/RUNBOOK.md#guestwakefailed"

      - alert: GuestWakeSlow
        # The feature's promise is a machine that comes back at once
        # (I-818). The gateway waits for a wake inside its 10 s dial
        # budget, so a p90 over 5 s means the next slow wake is a failed
        # ssh, and the user sees `did not answer ssh` on a machine that
        # is running. Measured over 15 minutes so one cold wake does not
        # fire it.
        expr: |
          histogram_quantile(0.9,
            sum by (host_id, le) (rate(repose_host_guest_wake_seconds_bucket[15m]))) > 5
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "waking a frozen guest on {{ $labels.host_id }} takes over 5s at p90"
          description: "{{ $value | humanizeDuration }} at p90. The host's load is the usual cause; compare with repose_host_load1 and the guests resting on it (repose_host_guests_resting)."
          runbook: "docs/ops/RUNBOOK.md#guestwakeslow"

      - alert: ApiWakeFailed
        # The api asked for a wake and could not get one (DECISIONS
        # I-822). This is the half of a failed wake the host's own
        # counter cannot see: a host that is not connected, or a wake
        # that ran out of time before hostd answered. Those are the
        # failures a user feels, because every one of them is somebody's
        # ssh, answer or command waiting on a machine the dashboard
        # still calls running.
        # Not a page, for GuestWakeFailed's reason: the next thing the
        # user does asks for the wake again.
        # `reason` here is what ASKED for the wake (connect, op, answer,
        # keep_awake) -- not the step that failed, which is what `reason`
        # means on GuestWakeFailed above. hostd knows the step; the api
        # only knows it got no answer, so this label says who was
        # waiting. Read the two together and they say "a connect was
        # waiting" and "the resume is what broke".
        expr: |
          sum by (reason) (increase(repose_api_resting_wake_total{result="failed"}[15m])) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "the api failed {{ $value }} wake(s) of a frozen machine (asked for by: {{ $labels.reason }})"
          description: "Loki `{component=\"api\"} | json | event=\"guest_wake_fail\"` names the project and the error. Check the host is connected (repose_api_grpc_streams) before the host's own GuestWakeFailed, which stays quiet when hostd never answered."
          runbook: "docs/ops/RUNBOOK.md#apiwakefailed"

  # Anti-abuse (DECISIONS I-238..I-240). Nothing here pages: the guest is
  # already blocked or stopped when these fire, and what remains is a
  # human decision about the account (`repose-admin users suspend`).
  - name: repose-abuse
    interval: 1m
    rules:
      - alert: EgressBlocked
        # hostd counts, per guest, the packets its blocks dropped: tcp 25
        # (smtp), the mining-pool ports (stratum) and new flows over the
        # per-guest rate (flows), and exports how many guests passed the
        # reason's threshold in the last ten minutes (100, 30 and 1000
        # packets). An app that tried to mail once stays under it; a spam
        # loop, a miner retrying its pool or a scan does not. guest_id is
        # never a label: hostd's egress_blocked log line names the guest.
        expr: repose_host_egress_blocked_guests > 0
        for: 2m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} guest(s) on {{ $labels.host_id }} keep hitting the {{ $labels.reason }} block"
          description: "Blocked and counted, not stopped. Find the guest in hostd's egress_blocked log line, then look at what it runs before deciding on the account."
          runbook: "docs/ops/RUNBOOK.md#egressblocked"

      - alert: MinerStopped
        # The api stopped a guest because its process samples named a
        # cryptocurrency miner (I-239). The stop is done; the account is
        # the operator's call. Summed over api replicas: only the one that
        # ingests the host's samples counts the stop.
        expr: sum by (kind) (increase(repose_api_abuse_stops_total[15m])) > 0
        for: 0m
        labels:
          severity: warn
        annotations:
          summary: "the api stopped a guest for abuse ({{ $labels.kind }})"
          description: "`repose-admin abuse list` names the project, owner and process. The third stop in 24 hours holds the project until `repose-admin abuse clear`; suspending the user is `repose-admin users suspend`."
          runbook: "docs/ops/RUNBOOK.md#minerstopped"

      - alert: BusyUnattended
        # Every vCPU at 90 percent or more for six hours, with no SSH
        # session, no tmux client and no agent in any sample (I-239). An
        # agent working for hours with nobody attached is the product, so a
        # present agent never counts. A miner under another name looks like
        # this; so does a runaway build. Alert only, nothing is stopped.
        expr: max(repose_api_abuse_busy_unattended_projects) > 0
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} project(s) at full CPU for six hours with nobody attached"
          description: "The Abuse dashboard's full-CPU panel names them; `repose-admin exec <id> -- ps -o comm,pcpu --sort -pcpu` (audited) shows what runs."
          runbook: "docs/ops/RUNBOOK.md#busyunattended"

  # The alerting path's own heartbeat (DECISIONS I-648), not deployed
  # (I-944). Watchdog always fires, and the design was that it be sent to
  # an Uptime Kuma push monitor every minute so Kuma notices when the
  # pushes stop -- the only way to hear that Prometheus, Grafana or the
  # personal server itself has died, since every other alert dies with
  # them. It is not deployed because the owner's Kuma runs on that same
  # server, so it would have died with the thing it watched. The rule
  # stays here as the record: if a watcher ever lives elsewhere, this and
  # its runbook entry are already written.
  - name: repose-meta
    interval: 1m
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: heartbeat
        annotations:
          summary: "the alerting path is working"
          description: "Always firing. Routed only to the Uptime Kuma push monitor, never to Chat."
          runbook: "docs/ops/RUNBOOK.md#watchdog"
