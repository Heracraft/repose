        noDataState: OK
        execErrState: OK
        isPaused: false
        labels:
          severity: warn
          stack: repose
        annotations:
          summary: "host {{ $labels.host_id }} is over 80 percent reserved memory"
          description: "{{ if $values.B }}{{ $values.B.Value | humanizePercentage }}{{ end }} of usable memory is reserved by running guests. Add a host before the next XL create fails."
          runbook: "docs/ops/RUNBOOK.md#hostmemory80"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: repose-prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: repose-prometheus
              editorMode: code
              expr: "repose_host_mem_reserved_bytes / (repose_host_mem_reserved_bytes + repose_host_mem_free_bytes)"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
