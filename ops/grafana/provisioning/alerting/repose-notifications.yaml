# Who repose's alerts go to, and how often. Hand-kept: unlike the rules next
# to it there is no second source to generate it from (DECISIONS I-942).
#
# Grafana's own alerting engine does the sending. There is no Alertmanager on
# the personal server and this adds none: Grafana's email and webhook contact
# points are built in.
#
# Nothing secret and no address is in this file. Grafana expands
# `$__env{NAME}` and `$__file{/path}` in provisioning files at load time, so
# the inbox comes from an environment variable and the Uptime Kuma push URL
# from a 0600 file. `ops/README.md`, install step 3, has where the owner sets
# each one. SMTP itself is not configured here -- it is Grafana's own
# `[smtp]`, set with `GF_SMTP_*` on the container (same step).
#
# Timing, which is what the Alertmanager route of the same shape used to hold
# (ops/alertmanager/repose-route.yaml, DECISIONS I-648 and I-848):
#
#   severity = page   20 s for the group, repeated hourly
#   everything else   30 s for the group, repeated every 12 hours
#   Watchdog          no wait, pushed to Uptime Kuma every 30 s
#
# Both email contact points go to the same inbox and differ only in the
# subject: a page reads as one in a notification.
#
# A WARNING ABOUT THE ROOT POLICY. `policies:` is the org's whole notification
# tree, not an addition to it. Provisioning this file replaces whatever
# notification policy the Grafana it is loaded into already had, and the UI
# will show the tree as provisioned and refuse to edit it. That is why the
# root route still sends to the owner's inbox: an alert from something else in
# this Grafana is delivered, not dropped.
#
# WHAT IS MISSING: INHIBITIONS. The Alertmanager route had seven
# `inhibit_rules` that kept one page per outage -- HostdDown held back
# HostUnreachable, PoolUnavailable held back the four other pool alerts,
# MonitoringPathDown held back the four scrape failures underneath it.
# Grafana-managed alerting has no inhibitions: its notification policies have
# matchers, grouping, timings and mute timings, and nothing that lets one
# firing alert suppress another. There is no file provisioning for them
# either, so this is not a gap in this file -- it is a gap in Grafana.
#
# The nearest honest equivalent, and what is done below, is grouping: every
# `severity = page` alert of this stack goes into ONE notification group
# (`group_by: [stack]`), so a single outage that trips HostdDown,
# HostUnreachable and MonitoringPathDown at once sends one email naming all
# three, instead of three emails. What is lost is the ranking: the email no
# longer says which of them is the cause, and the runbook heading for each is
# in the body for the reader to pick from. `group_interval` is 1 m rather than
# Alertmanager's 5 m so that a second, unrelated outage joining the group is
# at most a minute late.
#
# `severity = warn` and `info` keep Alertmanager's own grouping by alert and
# host, because there the inhibitions never applied to the page anyway and one
# email per host per alert is what the owner reads in the morning.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: repose-email
    receivers:
      - uid: repose-email
        type: email
        disableResolveMessage: false
        settings:
          addresses: $__env{REPOSE_ALERT_EMAIL}
          subject: '[{{ .CommonLabels.severity }}] {{ .GroupLabels.alertname }}{{ if .CommonLabels.host_id }} on {{ .CommonLabels.host_id }}{{ end }} ({{ .Status }})'
          message: |
            {{ range .Alerts }}{{ .Annotations.summary }}

            {{ .Annotations.description }}

            Runbook: {{ .Annotations.runbook }}
            Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
            {{ end }}

  - orgId: 1
    name: repose-email-page
    receivers:
      - uid: repose-email-page
        type: email
        disableResolveMessage: false
        settings:
          addresses: $__env{REPOSE_ALERT_EMAIL}
          subject: 'PAGE: {{ .GroupLabels.alertname }}{{ if .CommonLabels.host_id }} on {{ .CommonLabels.host_id }}{{ end }} ({{ .Status }})'
          message: |
            {{ range .Alerts }}{{ .Annotations.summary }}

            {{ .Annotations.description }}

            Runbook: {{ .Annotations.runbook }}
            Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
            {{ end }}

  # Watchdog and nothing else. A heartbeat that also went to email would
  # arrive every 30 seconds; a heartbeat that stopped at an email nobody reads
  # would say nothing. Kuma is the thing outside this server that notices the
  # silence. `disableResolveMessage` because Watchdog never resolves, and a
  # resolve push would look like a heartbeat.
  - orgId: 1
    name: repose-watchdog
    receivers:
      - uid: repose-watchdog
        type: webhook
        disableResolveMessage: true
        settings:
          url: $__file{/etc/grafana/secrets/repose-watchdog-url}
          httpMethod: POST

policies:
  - orgId: 1
    receiver: repose-email
    group_by: [grafana_folder, alertname, host_id]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      # Before the page route: Watchdog carries `severity = heartbeat`, but a
      # first match wins and this one must not be reachable by email.
      - receiver: repose-watchdog
        object_matchers:
          - [stack, =, repose]
          - [alertname, =, Watchdog]
        group_by: [alertname]
        group_wait: 0s
        # repeat_interval under group_interval on purpose: at 1 m, a flush a
        # few milliseconds short of the repeat was skipped and the pushes came
        # two minutes apart, which a 180 s Kuma monitor reads as down.
        group_interval: 1m
        repeat_interval: 30s

      # One group for every page of this stack, in place of the inhibitions
      # Grafana does not have (see the warning at the top of this file).
      - receiver: repose-email-page
        object_matchers:
          - [stack, =, repose]
          - [severity, =, page]
        group_by: [stack]
        group_wait: 20s
        group_interval: 1m
        repeat_interval: 1h

      - receiver: repose-email
        object_matchers:
          - [stack, =, repose]
        group_by: [grafana_folder, alertname, host_id]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
