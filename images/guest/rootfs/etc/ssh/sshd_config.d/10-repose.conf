# The guest's sshd (nix/guest/base/ssh.nix; docs/interfaces/ssh-gateway.md
# "Guest sshd"): certificates from the platform CA only, the project id as
# the one principal, no agent forwarding (DECISIONS I-247). Read before
# Ubuntu's sshd_config, so these values win.
HostKey /etc/ssh/ssh_host_ed25519_key
HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub
TrustedUserCAKeys /etc/ssh/user_ca.pub
AuthorizedPrincipalsFile /etc/ssh/principals/%u
AuthorizedKeysFile none
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers dev
ClientAliveInterval 30
ClientAliveCountMax 4
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding yes
GatewayPorts no
StreamLocalBindUnlink yes
PubkeyAuthentication yes
AcceptEnv TZ LANG COLORTERM
PrintMotd no
