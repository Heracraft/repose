# sshd (ssh.nix): a throwaway host key until guestd delivers the real one,
# an empty CA that trusts nobody until then, a reload that re-execs, and
# the keystroke path's resources (DECISIONS I-35, I-576).
[Service]
ExecStartPre=
ExecStartPre=/usr/local/libexec/repose/repose-sshd-prepare
ExecStartPre=/usr/sbin/sshd -t
ExecReload=
ExecReload=/bin/kill -HUP $MAINPID
OOMScoreAdjust=-800
MemoryLow=16M
