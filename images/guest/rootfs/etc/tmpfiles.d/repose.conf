# guestd.nix, env.nix, tmux.nix, ssh.nix, keystroke-path.nix.
d /run/repose 0755 root root -
d /run/repose/secrets 0700 dev dev -
d /run/repose/desktop 0700 dev dev -
d /run/repose/mcp 0700 dev dev -
d /etc/ssh/principals 0755 root root -
d /etc/repose 0755 root root -
d /home/dev/.repose 0700 dev dev -
d /home/dev/.local 0755 dev dev -
d /home/dev/.local/bin 0755 dev dev -
d /home/dev/.local/share 0755 dev dev -
d /home/dev/.local/share/pnpm 0755 dev dev -
d /home/dev/.local/share/pnpm/bin 0755 dev dev -
d /home/dev/.npm-global 0755 dev dev -
d /home/dev/.npm-global/bin 0755 dev dev -
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
# What NixOS-era scripts name as the system profile; /usr is it here.
d /run/current-system 0755 root root -
L /run/current-system/sw - - - - /usr/local/lib/repose/sw
