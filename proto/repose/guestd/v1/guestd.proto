// Contract: docs/interfaces/vsock-guestd.md. Length-prefixed protobuf over
// vsock port 5000 (or a unix socket in dev mode). One Envelope per frame.
syntax = "proto3";

package repose.guestd.v1;

option go_package = "github.com/heracraft/repose/internal/gen/guestd/v1;guestdv1";

import "repose/hostd/v1/hostd.proto";

message Envelope {
  string request_id = 1;   // empty for Notify
  oneof body {
    Request request = 2;
    Response response = 3;
    Notify notify = 4;
  }
}

message Secret { string name = 1; bytes value = 2; }

message Ping {}
message Freeze {}
message Thaw {}
// registration: `nix-store --dump-db` of the closure, loaded into the guest's
// database before the switch so nix knows the paths that arrived through the
// shared store (DECISIONS I-67). Empty keeps the pre-I-55 behaviour.
message Switch { string system_closure = 1; bool force_reboot = 2; bytes registration = 3; }
// RegisterPaths loads a `nix-store --dump-db` listing into the guest's nix
// database; hostd sends one for the booted closure right after Ready.
message RegisterPaths { bytes registration = 1; }
message GrowFs {}
message WriteSecrets { repeated Secret secrets = 1; }
message SetPrincipals { repeated string principals = 1; }
message SetupProject { string project_slug = 1; string remote_url = 2; string tz = 3; string lang = 4; bytes project_json = 5; }
message Sample {}
message Exec { repeated string argv = 1; uint32 timeout_s = 2; string as_user = 3; }
message Shutdown { uint32 timeout_s = 1; }
// AnswerQuestion closes a question a `repose-ask` in this guest is waiting
// on (DECISIONS I-244): status answered|cancelled|expired|no_channel, and
// the user's answer when answered. Answering an already-closed question
// with the same status is a no-op; an unknown question_id is not_found.
message AnswerQuestion { string question_id = 1; string status = 2; string answer = 3; }

message Request {
  oneof req {
    Ping ping = 1;
    Freeze freeze = 2;
    Thaw thaw = 3;
    Switch switch = 4;
    GrowFs grow_fs = 5;
    WriteSecrets write_secrets = 6;
    SetPrincipals set_principals = 7;
    SetupProject setup_project = 8;
    Sample sample = 9;
    Exec exec = 10;
    Shutdown shutdown = 11;
    RegisterPaths register_paths = 12;
    AnswerQuestion answer_question = 13;
  }
}

message Error { string code = 1; string message = 2; }

message PingResult { string version = 1; uint64 uptime_s = 2; string boot_id = 3; }
message SwitchResult { bool rebooted = 1; bool needs_reboot = 2; bytes output = 3; }
message GrowFsResult { uint64 new_bytes = 1; }
// partial is set when the sample deadline (1 s) expired and some signals are
// missing rather than zero. See docs/interfaces/vsock-guestd.md.
message SampleResult {
  repose.hostd.v1.GuestSignals signals = 1;
  repeated repose.hostd.v1.ProcSample procs = 2;
  bool partial = 3;
  // The guest's /proc/pressure/cpu "some" total in microseconds, a
  // cumulative counter since boot; 0 when the kernel has no PSI. hostd
  // turns it into GuestSample.cpu_pressure_us_delta (DECISIONS I-493).
  uint64 cpu_pressure_us_total = 4;
  // MemTotal less MemAvailable from the guest's /proc/meminfo, in bytes;
  // 0 when it cannot be read (DECISIONS I-493).
  uint64 mem_used_bytes = 5;
}
message ExecResult { int32 exit_code = 1; bytes stdout = 2; bytes stderr = 3; }

message Response {
  bool ok = 1;
  Error error = 2;
  oneof result {
    PingResult ping = 10;
    SwitchResult switch = 11;
    GrowFsResult grow_fs = 12;
    SampleResult sample = 13;
    ExecResult exec = 14;
  }
}

message Ready { string boot_id = 1; }
message AgentEvent { string agent = 1; string tmux_window = 2; string kind = 3; string summary = 4; }
message AgentState { string agent = 1; string tmux_window = 2; string state = 3; }
message Warning { string kind = 1; string detail = 2; }
// Question is a `repose-ask` (DECISIONS I-244). guestd sends it when the
// ask starts, again on every new hostd connection while it is open (the
// api inserts by question_id, so a repeat is harmless), and once more with
// state cancelled|expired when the asker gives up. text is capped at 1 KB,
// options at 3 of 64 bytes each. state "" means open.
message Question {
  string question_id = 1;
  string agent = 2;
  string tmux_window = 3;
  string text = 4;
  repeated string options = 5;
  uint32 timeout_s = 6;
  string state = 7;
}

message Notify {
  oneof n {
    Ready ready = 1;
    AgentEvent agent_event = 2;
    AgentState agent_state = 3;
    Warning warning = 4;
    Question question = 5;
  }
}
