// Contract: docs/interfaces/vsock-guestd.md. Length-prefixed protobuf over
// vsock port 5000 (or a unix socket in dev mode). One Envelope per frame.
syntax = "proto3";

package repose.guestd.v1;

option go_package = "github.com/heracraft/repose/internal/gen/guestd/v1;guestdv1";

import "repose/hostd/v1/hostd.proto";

message Envelope {
  string request_id = 1;   // empty for Notify, except an ApplyMenuProgress (I-1460)
  oneof body {
    Request request = 2;
    Response response = 3;
    Notify notify = 4;
  }
}

message Secret { string name = 1; bytes value = 2; }

// features names what the pinging hostd relays that an older one does
// not (DECISIONS I-929): "question_secret", AgentQuestion.secret. guestd
// takes a `repose-ask --secret` only after a hostd has said so, because
// an older hostd would drop the name and pass the question on as one the
// owner answers in text.
message Ping { repeated string features = 1; }
message Freeze {}
message Thaw {}
// registration: `nix-store --dump-db` of the closure, loaded into the guest's
// database before the switch so nix knows the paths that arrived through the
// shared store (DECISIONS I-67). Empty keeps the pre-I-55 behaviour.
// Nix guests only: an erofs guest answers `unimplemented` (DECISIONS I-1460).
message Switch { string system_closure = 1; bool force_reboot = 2; bytes registration = 3; }
// RegisterPaths loads a `nix-store --dump-db` listing into the guest's nix
// database; hostd sends one for the booted closure right after Ready.
// Nix guests only: an erofs guest answers `unimplemented` (DECISIONS I-1460).
message RegisterPaths { bytes registration = 1; }
message GrowFs {}
message WriteSecrets { repeated Secret secrets = 1; }
message SetPrincipals { repeated string principals = 1; }
message SetupProject { string project_slug = 1; string remote_url = 2; string tz = 3; string lang = 4; bytes project_json = 5; }
message Sample {}
message Exec { repeated string argv = 1; uint32 timeout_s = 2; string as_user = 3; }
message Shutdown { uint32 timeout_s = 1; }
// AnswerQuestion closes a question a `repose-ask` in this guest is waiting
// on (DECISIONS I-244): status answered|cancelled|expired|no_channel, and
// the user's answer when answered. Answering an already-closed question
// with the same status is a no-op; an unknown question_id is not_found.
// status `extended` (DECISIONS I-1242) closes nothing: expires_unix (unix
// seconds) is the question's new deadline, applied only when it is later
// than the one it has.
message AnswerQuestion {
  string question_id = 1;
  string status = 2;
  string answer = 3;
  int64 expires_unix = 4;
}
// SayToAgent is a message the owner typed for one of this guest's agents
// (DECISIONS I-1144). text is tenant content, capped at 4 KB, and is
// never logged. window is the tmux window or herdr agent key; empty means
// the guest's single agent window, and more than one is invalid_argument
// naming them. sender is who typed it, and from_owner says whether it was
// the project's owner; a message from anyone else reaches the agent
// prefixed `[from <sender>]`. guestd types it into the agent's own
// terminal the moment the agent's hook state is idle or needs_input, and
// holds it until the turn ends otherwise. One message waits per window:
// a second replaces the first, and the result says so.
message SayToAgent {
  string say_id = 1;
  string window = 2;
  string text = 3;
  string sender = 4;
  bool from_owner = 5;
}

// Trigger is one of the project's triggers, as the api owns it
// (DECISIONS I-1248). The prompt is a PATH in the machine and never its
// text: the api has never held the text and cannot send it. guestd keeps
// the set in memory only, and the api re-sends it on every start.
message Trigger {
  string name = 1;
  string kind = 2;            // route|schedule
  string prompt_path = 3;     // relative to workdir, or absolute
  string workdir = 4;         // checkout|worktree-N|~/PATH|/PATH
  string agent = 5;           // empty means the project's agent
  uint32 timeout_s = 6;
  uint32 concurrency = 7;
  string gate = 9;            // the admission command; empty means none
  string dedupe = 10;         // header:NAME|json:FIELD; empty means none
  bool enabled = 11;
}
// SetTriggers carries the project's whole set, as WriteSecrets carries the
// whole named set (DECISIONS I-1248). An empty list removes every trigger.
message SetTriggers { repeated Trigger triggers = 1; }
// WriteTriggerPrompt writes one trigger's prompt into the machine as dev
// (DECISIONS I-1266). The dashboard has no SSH, so a prompt typed in the
// browser reaches the machine this way; the api holds the text for the
// length of the request and the hand-off that follows it and stores it
// nowhere, so the row still keeps a path and never the text. The path is
// read exactly as the runner reads it: relative to the workdir, or
// absolute.
message WriteTriggerPrompt {
  string trigger = 1;
  string workdir = 2;        // checkout|worktree-N|~/PATH|/PATH
  string prompt_path = 3;    // relative to workdir, or absolute
  bytes text = 4;            // at most 64 KB, as the runner reads at most 64 KB
}
// RunTrigger runs one now (DECISIONS I-1252, I-1256). run_id is the api's
// row and the command's idempotency key: a repeat is answered with that
// run's state and starts no second agent. payload_run replays an earlier
// run's kept payload; dry_run runs the gate alone and starts no agent.
message RunTrigger {
  string trigger = 1;
  string run_id = 2;
  string source = 3;          // clock|hand
  string payload_run = 4;
  bool dry_run = 5;
  // The file `repose triggers fire --payload FILE` wrote over SSH, which
  // the runner copies into the run's own directory. It is always under
  // the trigger's own folder; the api checks that, and the bytes never
  // pass through the api (DECISIONS I-1248).
  string payload_path = 6;
}

// ApplyMenu makes the guest's installed packages and services match menu
// (DECISIONS I-1460), erofs guests only; a Nix guest answers
// `unimplemented`. It is a state, not a diff, so the same menu twice
// changes nothing and answers done. replay_after_base_upgrade is set on
// the call hostd makes at a boot: guestd then applies the menu only when
// the base changed under it (the /.base-upgraded marker on vdb) or the
// menu differs from the one it last applied, and answers done at once
// otherwise. While it works guestd sends ApplyMenuProgress lines as Notify
// frames whose Envelope.request_id is this request's; the Response's
// ApplyMenuProgress, done set, ends it.
message ApplyMenu {
  repose.hostd.v1.MenuSpec menu = 1;
  bool replay_after_base_upgrade = 2;
}

message Request {
  oneof req {
    Ping ping = 1;
    Freeze freeze = 2;
    Thaw thaw = 3;
    Switch switch = 4;
    GrowFs grow_fs = 5;
    WriteSecrets write_secrets = 6;
    SetPrincipals set_principals = 7;
    SetupProject setup_project = 8;
    Sample sample = 9;
    Exec exec = 10;
    Shutdown shutdown = 11;
    RegisterPaths register_paths = 12;
    AnswerQuestion answer_question = 13;
    SayToAgent say_to_agent = 14;
    SetTriggers set_triggers = 15;
    RunTrigger run_trigger = 16;
    WriteTriggerPrompt write_trigger_prompt = 17;
    ApplyMenu apply_menu = 18;  // DECISIONS I-1460
  }
}

message Error { string code = 1; string message = 2; }

message PingResult { string version = 1; uint64 uptime_s = 2; string boot_id = 3; }
message SwitchResult { bool rebooted = 1; bool needs_reboot = 2; bytes output = 3; }
message GrowFsResult { uint64 new_bytes = 1; }
// partial is set when the sample deadline (1 s) expired and some signals are
// missing rather than zero. See docs/interfaces/vsock-guestd.md.
message SampleResult {
  repose.hostd.v1.GuestSignals signals = 1;
  repeated repose.hostd.v1.ProcSample procs = 2;
  bool partial = 3;
  // The guest's /proc/pressure/cpu "some" total in microseconds, a
  // cumulative counter since boot; 0 when the kernel has no PSI. hostd
  // turns it into GuestSample.cpu_pressure_us_delta (DECISIONS I-493).
  uint64 cpu_pressure_us_total = 4;
  // MemTotal less MemAvailable from the guest's /proc/meminfo, in bytes;
  // 0 when it cannot be read (DECISIONS I-493).
  uint64 mem_used_bytes = 5;
  // The root filesystem from statfs, in bytes: blocks less those available
  // to dev (so root's reserve counts as used, as the disk_high warning
  // counts it), and blocks. Both 0 when statfs fails (DECISIONS I-567).
  uint64 root_used_bytes = 6;
  uint64 root_size_bytes = 7;
}
message ExecResult { int32 exit_code = 1; bytes stdout = 2; bytes stderr = 3; }
// SayResult says what became of a SayToAgent: state delivered (it is in
// the agent's terminal now) or waiting (the agent is mid-turn and it goes
// in at the end of the turn), the window it went to or waits in, and
// whether it replaced a message that was still waiting there.
message SayResult { string state = 1; string window = 2; bool replaced = 3; }

// TriggerRunResult is guestd's answer to a RunTrigger: state working (the
// window is open and the agent has its prompt), skipped (admission
// refused it) or failed (the prompt file is gone, or no agent is
// installed), with the window and the bounded reason.
message TriggerRunResult { string state = 1; string window = 2; string reason = 3; }

// ApplyMenuProgress is one step of an ApplyMenu (DECISIONS I-1460). Sent
// as a Notify with done false, line is one line of output for the user
// (an install's own words, at most 1 KB). As the Response's result, done
// is true: error_code empty is success, else `menu_failed` (an item did
// not install or start; line names it) or `invalid_argument` (an unknown
// catalog id or option, an item with both or neither of id and package, a
// package name outside [a-z0-9][a-z0-9+.-]{0,127}), and the Response's
// ok is false with the same code in its Error.
message ApplyMenuProgress { string line = 1; bool done = 2; string error_code = 3; }

message Response {
  bool ok = 1;
  Error error = 2;
  oneof result {
    PingResult ping = 10;
    SwitchResult switch = 11;
    GrowFsResult grow_fs = 12;
    SampleResult sample = 13;
    ExecResult exec = 14;
    SayResult say = 15;
    TriggerRunResult trigger_run = 16;
    ApplyMenuProgress apply_menu = 17;  // DECISIONS I-1460
  }
}

message Ready { string boot_id = 1; }
// tmux_window in AgentEvent, AgentState and Question is a tmux window name
// or a herdr agent key, at most 64 bytes (DECISIONS I-504).
// link_url and link_label are the `--link URL --label TEXT` of a
// repose-notify (DECISIONS I-931), checked by internal/msglink; empty on
// every other event.
message AgentEvent { string agent = 1; string tmux_window = 2; string kind = 3; string summary = 4; string link_url = 5; string link_label = 6; }
message AgentState { string agent = 1; string tmux_window = 2; string state = 3; }
message Warning { string kind = 1; string detail = 2; }
// Question is a `repose-ask` (DECISIONS I-244). guestd sends it when the
// ask starts, again on every new hostd connection while it is open (the
// api inserts by question_id, so a repeat is harmless), and once more with
// state cancelled|expired when the asker gives up. text is capped at 1 KB,
// options at 3 of 64 bytes each. state "" means open.
message Question {
  string question_id = 1;
  string agent = 2;
  // A tmux window name or a herdr agent key, at most 64 bytes (I-504).
  string tmux_window = 3;
  string text = 4;
  repeated string options = 5;
  uint32 timeout_s = 6;
  string state = 7;
  // Why a guest-side close happened: terminal|withdrawn|interrupted|asker_gone
  // (I-690). Empty on an open and on older guests.
  string reason = 8;
  // The named secret a `repose-ask --secret NAME` asks for (DECISIONS
  // I-929), [A-Z][A-Z0-9_]{0,63}. The value never travels this way: the
  // owner sets it through the api's secrets store, and the AnswerQuestion
  // that closes the question carries no answer.
  string secret = 9;
  // The `--link URL --label TEXT` of the ask (DECISIONS I-931).
  string link_url = 10;
  string link_label = 11;
}

// TriggerRun is a run's state as the runner changes it (DECISIONS
// I-1256). A run a webhook delivery started is announced here with state
// working, which is how the api learns of a run it did not ask for. Open
// runs are announced again on each new hostd connection for ten minutes,
// as open questions are. summary is the agent's own `--done` words, 1 KB,
// tenant content; reason is the bounded enum of features/triggers.md §4,
// except a gate's last stderr line, at most 200 bytes.
message TriggerRun {
  string run_id = 1;
  string trigger = 2;
  string state = 3;           // working|done|failed|timeout|skipped
  string reason = 4;
  string summary = 5;
  string link_url = 6;
  string link_label = 7;
  string window = 8;
  int64 started_unix = 9;
  int64 finished_unix = 10;
  // The dedupe key the run was admitted or skipped on, at most 128 bytes
  // (DECISIONS I-1254). It is the provider's own event id, which is why
  // it is in the run row and in no log line.
  string dedupe_key = 11;
  uint64 payload_bytes = 12;
  // 13 was payload_kept, which the api derives from payload_bytes on a
  // run that survived retention (I-1262): nothing in the guest ever
  // cleared the flag, so it was a promise the row could not keep.
  reserved 13;
  // The source, for a run the api did not start: route (a delivery) or,
  // after a guestd restart, the source the run was started with.
  string source = 14;
}

message Notify {
  oneof n {
    Ready ready = 1;
    AgentEvent agent_event = 2;
    AgentState agent_state = 3;
    Warning warning = 4;
    Question question = 5;
    TriggerRun trigger_run = 6;
    // A progress line of the ApplyMenu named by the Envelope's request_id
    // (DECISIONS I-1460).
    ApplyMenuProgress apply_menu_progress = 7;
  }
}
