// Contract: docs/interfaces/grpc-hostd.md. The host dials the api and holds
// one Session stream; commands flow down, results, samples and events flow up.
syntax = "proto3";

package repose.hostd.v1;

option go_package = "github.com/heracraft/repose/internal/gen/hostd/v1;hostdv1";

service HostService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Rotate(RegisterRequest) returns (RegisterResponse);
  rpc Session(stream HostMessage) returns (stream ApiMessage);
}

message HostInfo {
  string hostname = 1;
  string sku = 2;
  uint64 mem_bytes = 3;
  uint32 vcpus = 4;
  string nixos_system = 5;
  string ch_version = 6;
  uint64 pool_bytes = 7;
}

message WireguardPeer {
  string endpoint = 1;
  string public_key = 2;
  string address = 3;      // this host's wg address, CIDR
  repeated string allowed_ips = 4;
}

message RegisterRequest {
  string join_token = 1;
  HostInfo info = 2;
}

message RegisterResponse {
  string host_id = 1;
  bytes client_cert = 2;
  bytes client_key = 3;
  string guest_cidr = 4;
  WireguardPeer edge = 5;
  string wg_private_key = 6;
  // Where this host's Fluent Bit ships journald and guest console logs,
  // as scheme://host[:port]. host.json has carried a `loki_url` field
  // since workstream 01 and nothing ever filled it, so every host
  // rendered an empty LOKI_HOST. Empty is still accepted and still means
  // "do not ship" (DECISIONS I-95).
  string loki_url = 7;
  // The SSH Host CA's public key as an authorized_keys line. It lands in
  // host.json as host_ca_pub, which the host renders into
  // /run/repose/host_ca.pub for sshd's TrustedUserCAKeys, so an operator
  // certificate from `repose-admin operator-cert` opens the host
  // (host-conventions.md "Operator access"). Register and Rotate both
  // carry it; empty keeps what host.json already has (DECISIONS I-139;
  // security review M-1).
  string host_ca_pub = 8;
}

message ApiMessage {
  oneof msg {
    Command command = 1;
    Ack ack = 2;
  }
}

message HostMessage {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    Result result = 3;
    Samples samples = 4;
    Event event = 5;
    BuildLog log = 6;
  }
}

message Ack { string event_id = 1; }

message GuestStatus {
  string guest_id = 1;
  string state = 2;
  string ip = 3;
  uint32 vsock_cid = 4;
  string system_closure = 5;
}

message Hello {
  string host_id = 1;
  repeated GuestStatus guests = 2;
  uint64 free_mem_bytes = 3;
  uint64 pool_free_bytes = 4;
}

message Heartbeat {
  uint64 free_mem_bytes = 1;
  uint64 pool_free_bytes = 2;
  double load1 = 3;
  uint32 running_guests = 4;
  bool draining = 5;
}

message Secret { string name = 1; bytes value = 2; }

message Limits {
  uint32 eval_s = 1;
  uint32 build_s = 2;
  uint32 cores = 3;
  uint64 closure_bytes = 4;
}

message CreateGuest {
  string project_id = 1;
  string guest_id = 2;
  string class = 3;
  uint64 volume_bytes = 4;
  string system_closure = 5;
  repeated Secret secrets = 6;
  map<string, string> env = 7;
  string ssh_ca_pub = 8;
  repeated string principals = 9;
  bytes hooks_config = 10;
  bytes host_key = 11;   // guest sshd ed25519 private key, generated by the api (I-3)
  bytes host_cert = 12;  // its Host-CA certificate
  // DECISIONS I-26: what SetupProject and the snapshot path need.
  string user_id = 13;
  string project_slug = 14;
  string remote_url = 15;
  bytes project_json = 16;
}
// StartGuest carries the same delivery fields as CreateGuest (DECISIONS
// I-26) so a host that restarted, and holds nothing on disk, can deliver
// secrets and sshd material again. All are optional; an old-shape
// StartGuest with only guest_id is still accepted.
// class is the project's size class; when set and different from the one
// the guest was created with, hostd boots the guest at this class and
// records it (DECISIONS I-260). Empty keeps the recorded class.
message StartGuest {
  string guest_id = 1;
  repeated Secret secrets = 2;
  map<string, string> env = 3;
  string ssh_ca_pub = 4;
  repeated string principals = 5;
  bytes hooks_config = 6;
  bytes host_key = 7;
  bytes host_cert = 8;
  bytes project_json = 9;
  string class = 10;
}
message StopGuest { string guest_id = 1; bool snapshot_first = 2; uint32 timeout_s = 3; }
message DestroyGuest { string guest_id = 1; bool keep_volume = 2; }
message ResizeVolume { string guest_id = 1; uint64 new_bytes = 2; }
message Build {
  string project_id = 1;
  string revision_id = 2;
  bytes fragment = 3;
  string base_ref = 4;
  Limits limits = 5;
  // The base_versions label the closure is stamped with
  // (/etc/repose/base-version, the NixOS label); empty keeps the
  // flake's own stamp, which under hostd's --override-input is "dirty"
  // (DECISIONS I-118).
  string base_version = 6;
}
message ApplyConfig { string guest_id = 1; string system_closure = 2; bool force_reboot = 3; }
message Snapshot { string guest_id = 1; string reason = 2; }
message Restore {
  string project_id = 1;
  string guest_id = 2;
  string blob_path = 3;
  string class = 4;
  uint64 volume_bytes = 5;
  repeated Secret secrets = 6;
  map<string, string> env = 7;
  string ssh_ca_pub = 8;
  repeated string principals = 9;
  bytes hooks_config = 10;
  bytes host_key = 11;
  bytes host_cert = 12;
  string user_id = 13;
  string project_slug = 14;
  string remote_url = 15;
  bytes project_json = 16;
  string system_closure = 17;  // I-26: the closure to root; empty means the api rebuilds before StartGuest
  string sha256 = 18;  // I-462: hex SHA-256 of the stored blob; when set, hostd checks the whole blob against it before writing the volume
}
message UpdateSecrets { string guest_id = 1; repeated Secret secrets = 2; }
message SetPrincipals { string guest_id = 1; repeated string principals = 2; }
message Exec { string guest_id = 1; repeated string argv = 2; uint32 timeout_s = 3; string audit_id = 4; }  // audit_id required (I-26)
message Drain {}
// AnswerQuestion carries the user's reply (or the question's end) to the
// guest whose `repose-ask` is waiting (DECISIONS I-244). hostd forwards it
// to guestd as the request of the same name; not_found means the guest no
// longer knows the question (it rebooted, or the ask was never there).
message AnswerQuestion { string guest_id = 1; string question_id = 2; string status = 3; string answer = 4; }

message Command {
  string command_id = 1;
  oneof cmd {
    CreateGuest create_guest = 10;
    StartGuest start_guest = 11;
    StopGuest stop_guest = 12;
    DestroyGuest destroy_guest = 13;
    ResizeVolume resize_volume = 14;
    Build build = 15;
    ApplyConfig apply_config = 16;
    Snapshot snapshot = 17;
    Restore restore = 18;
    UpdateSecrets update_secrets = 19;
    SetPrincipals set_principals = 20;
    Exec exec = 21;
    Drain drain = 22;
    AnswerQuestion answer_question = 23;
  }
}

message Error {
  string code = 1;      // see docs/interfaces/grpc-hostd.md
  string message = 2;
  int32 fragment_line = 3;
}

message Result {
  string command_id = 1;
  bool ok = 2;
  Error error = 3;
  oneof payload {
    CreateResult create = 10;
    StopResult stop = 11;
    BuildResult build = 12;
    ApplyResult apply = 13;
    SnapshotResult snapshot = 14;
    ExecResult exec = 15;
  }
}
message CreateResult { string guest_ip = 1; uint32 vsock_cid = 2; }
message StopResult { string snapshot_id = 1; string blob_path = 2; uint64 bytes = 3; string sha256 = 4; }  // blob_path, bytes and sha256 when snapshot_first (I-26, I-462)
message BuildResult { string system_closure = 1; uint64 closure_bytes = 2; bool kernel_changed = 3; }
message ApplyResult { bool rebooted = 1; bool reboot_required = 2; }
message SnapshotResult { string snapshot_id = 1; string blob_path = 2; uint64 bytes = 3; string sha256 = 4; }  // sha256: hex SHA-256 of the uploaded blob (I-462)
message ExecResult { int32 exit_code = 1; bytes stdout = 2; bytes stderr = 3; }

message BuildLog { string command_id = 1; uint64 seq = 2; string line = 3; }

message AgentProc { string agent = 1; string tmux_window = 2; string state = 3; }
message ProcSample { string comm = 1; uint64 cpu_ns_delta = 2; uint64 rss_bytes = 3; }
message GuestSignals {
  uint32 ssh_sessions = 1;
  uint32 tmux_clients = 2;
  repeated AgentProc agents = 3;
  uint32 docker_containers = 4;
  bool guestd_ok = 5;
}
message GuestSample {
  string guest_id = 1;
  string state = 2;
  string class = 3;
  uint64 cpu_ns_delta = 4;
  uint64 mem_rss_bytes = 5;
  uint64 net_tx_bytes_delta = 6;
  uint64 net_rx_bytes_delta = 7;
  uint64 disk_alloc_bytes = 8;
  uint64 disk_used_bytes = 9;
  GuestSignals signals = 10;
  repeated ProcSample procs = 11;
}
message HostSample { uint64 mem_free = 1; uint64 pool_free = 2; double load1 = 3; uint32 builds_running = 4; }
message Samples { int64 ts = 1; repeated GuestSample guests = 2; HostSample host = 3; }

message GuestStateChanged { string guest_id = 1; string state = 2; string reason = 3; }
message AgentEvent {
  string guest_id = 1;
  string agent = 2;
  string kind = 3;
  string summary = 4;
  // The tmux window the hook came from, as guestd resolved it (the
  // `window` of 13-notifications.md §5.1); empty when unknown. I-121.
  string tmux_window = 5;
}
// AgentQuestion is a guest's Question notify, relayed (DECISIONS I-244).
// The text is tenant content: delivered to the user's channels, never
// logged.
message AgentQuestion {
  string guest_id = 1;
  string question_id = 2;
  string agent = 3;
  string tmux_window = 4;
  string text = 5;
  repeated string options = 6;
  uint32 timeout_s = 7;
  string state = 8;
}
message SnapshotDone { string guest_id = 1; string snapshot_id = 2; string blob_path = 3; uint64 bytes = 4; string sha256 = 5; }
message HostWarning { string kind = 1; string detail = 2; }
// An operator's SSH login to the host, from the PAM hook that runs
// `hostd audit-login`: what the api turns into the audit_log row 14 §5
// requires (DECISIONS I-140). Carries the certificate's key id and serial
// and a key fingerprint, never a key or certificate body, and never the
// source address.
message OperatorLogin {
  string pam_type = 1;        // open_session|close_session
  bool user_present = 2;
  string key_id = 3;          // certificate key_id (operator:<name>), empty for a plain key
  uint64 serial = 4;          // certificate serial, 0 for a plain key
  string key_fingerprint = 5; // SHA256:... of the key (the bootstrap key when key_id is empty)
}
message Event {
  string event_id = 1;
  int64 ts = 2;
  oneof ev {
    GuestStateChanged guest_state_changed = 10;
    AgentEvent agent_event = 11;
    SnapshotDone snapshot_done = 12;
    HostWarning host_warning = 13;
    OperatorLogin operator_login = 14;
    AgentQuestion agent_question = 15;
  }
}
