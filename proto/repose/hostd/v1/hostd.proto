// Contract: docs/interfaces/grpc-hostd.md. The host dials the api and holds
// one Session stream; commands flow down, results, samples and events flow up.
syntax = "proto3";

package repose.hostd.v1;

option go_package = "github.com/heracraft/repose/internal/gen/hostd/v1;hostdv1";

service HostService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Rotate(RegisterRequest) returns (RegisterResponse);
  rpc Session(stream HostMessage) returns (stream ApiMessage);
}

message HostInfo {
  string hostname = 1;
  string sku = 2;
  uint64 mem_bytes = 3;
  uint32 vcpus = 4;
  string nixos_system = 5;
  string ch_version = 6;
  uint64 pool_bytes = 7;
  // The host's physical cores, which is what placement counts committed
  // guest vCPUs against. vcpus is the SMT thread count runtime.NumCPU()
  // reports, twice the cores on every host repose runs on, so a ratio
  // computed against it permits about twice the load at which typing
  // stops being smooth (2026-10-14-host-cpu-capacity.md, sections 1 and
  // 3). Not Limits.cores, which is a nix build's job count. 0 from a
  // hostd older than I-735, for which the api records vcpus / 2 instead,
  // accepted for one release (DECISIONS I-735).
  uint32 cores = 8;
  // The host's CPU architecture in Nix/Linux form ("x86_64", "aarch64").
  // Empty from a hostd older than I-1448, which leaves hosts.arch null
  // until the host upgrades and sends it in Hello or Rotate. Never parsed
  // from nixos_system, which is the /nix/store/... closure path
  // (DECISIONS I-1448).
  string arch = 9;
}

message WireguardPeer {
  string endpoint = 1;
  string public_key = 2;
  string address = 3;      // this host's wg address, CIDR
  repeated string allowed_ips = 4;
}

message RegisterRequest {
  string join_token = 1;
  HostInfo info = 2;
}

message RegisterResponse {
  string host_id = 1;
  bytes client_cert = 2;
  bytes client_key = 3;
  string guest_cidr = 4;
  WireguardPeer edge = 5;
  string wg_private_key = 6;
  // Where this host's Fluent Bit ships journald and guest console logs,
  // as scheme://host[:port]. host.json has carried a `loki_url` field
  // since workstream 01 and nothing ever filled it, so every host
  // rendered an empty LOKI_HOST. Empty is still accepted and still means
  // "do not ship" (DECISIONS I-95).
  string loki_url = 7;
  // The SSH Host CA's public key as an authorized_keys line. It lands in
  // host.json as host_ca_pub, which the host renders into
  // /run/repose/host_ca.pub for sshd's TrustedUserCAKeys, so an operator
  // certificate from `repose-admin operator-cert` opens the host
  // (host-conventions.md "Operator access"). Register and Rotate both
  // carry it; empty keeps what host.json already has (DECISIONS I-139;
  // security review M-1).
  string host_ca_pub = 8;
}

message ApiMessage {
  oneof msg {
    Command command = 1;
    Ack ack = 2;
  }
}

message HostMessage {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    Result result = 3;
    Samples samples = 4;
    Event event = 5;
    BuildLog log = 6;
  }
}

message Ack { string event_id = 1; }

message GuestStatus {
  string guest_id = 1;
  string state = 2;
  string ip = 3;
  uint32 vsock_cid = 4;
  string system_closure = 5;
  // The host boot id whose start found this guest running (or starting)
  // with no hypervisor: the host restarted under it. Empty when the guest
  // was not interrupted, or has started, stopped, been destroyed or been
  // restored since (DECISIONS I-645).
  string interrupted_boot_id = 6;
  // When hostd recorded the interruption, unix seconds; 0 with no mark.
  int64 interrupted_at = 7;
  // When this guest was paused, unix seconds; 0 when it is not paused
  // (DECISIONS I-818). A paused guest's state stays `running`: resting is
  // a marker on a running guest, never a state of its own. hostd
  // reconciles it from bbolt and the hypervisor's vm.info at start, so
  // every Hello after a hostd or api restart carries it again. 0 from a
  // hostd older than I-818, which the api reads as "not resting".
  int64 resting_at = 8;
  // The api has withdrawn this guest's burst: its account used the
  // period's burst core-hours and overage is off, so the guest runs on
  // the base cores its class sells until the period ends (DECISIONS
  // I-1128). hostd keeps it in bbolt and reports it in every Hello, so
  // the api can reconcile without resending. False from a hostd older
  // than this, and false is "may burst".
  bool burst_denied = 9;
  // The base_versions label of the erofs base this guest boots, or last
  // booted, as hostd recorded it from the BaseImage of its last create,
  // start or restore (DECISIONS I-1458). Empty for a Nix guest, whose
  // system is system_closure, and from a hostd older than I-1458.
  string base_version = 10;
}

message Hello {
  string host_id = 1;
  repeated GuestStatus guests = 2;
  uint64 free_mem_bytes = 3;
  uint64 pool_free_bytes = 4;
  // The thin pool's data size, which autoextend grows; 0 from a hostd
  // older than I-586, which the api reads as "unknown" (DECISIONS I-586).
  uint64 pool_bytes = 5;
  // The host's thin pool cannot hold a guest's volume: inactive after a
  // reboot, missing, or failed (DECISIONS I-644). pool_free_bytes and
  // pool_bytes are 0 while it is set, so an api older than the field keeps
  // new machines off the host too. Absent from an older hostd: false.
  bool pool_unavailable = 6;
  // The host's current boot id (/proc/sys/kernel/random/boot_id) and when
  // that boot began, unix seconds. Empty and 0 from a hostd older than
  // I-645, which the api reads as "no resume information".
  string host_boot_id = 7;
  int64 host_boot_at = 8;
  // What this hostd can do that an older one cannot, so the api sends a
  // command shape only to a host that takes it. "local_clone": a Restore
  // may carry `clone` (DECISIONS I-701). "pause": PauseGuest and
  // WakeGuest (DECISIONS I-818). "burst": this host boots guests at their
  // class ceiling, runs the cpu.max controller and takes SetBurst
  // (DECISIONS I-1126). "nix": this host builds and boots Nix guests
  // (system_closure); "erofs": it boots guests from a BaseImage
  // (DECISIONS I-1458). The api places an erofs project only on a host
  // that names "erofs", and a Nix project only on a host that names
  // "nix" or names neither, which is every hostd older than I-1458.
  // Absent from an older hostd, which answers a command it does not
  // know `invalid_argument`.
  repeated string features = 9;
  // The host's CPU architecture ("x86_64", "aarch64"), so an already-
  // registered host populates hosts.arch on its first reconnect after
  // upgrading hostd without re-registering (DECISIONS I-1448). Empty from
  // a hostd older than this, which keeps whatever hosts.arch already holds.
  string arch = 10;
}

message Heartbeat {
  uint64 free_mem_bytes = 1;
  uint64 pool_free_bytes = 2;
  double load1 = 3;
  uint32 running_guests = 4;
  bool draining = 5;
  // As Hello's pool_bytes (DECISIONS I-586).
  uint64 pool_bytes = 6;
  // As Hello's pool_unavailable (DECISIONS I-644).
  bool pool_unavailable = 7;
}

message Secret { string name = 1; bytes value = 2; }

message Limits {
  uint32 eval_s = 1;
  uint32 build_s = 2;
  uint32 cores = 3;
  uint64 closure_bytes = 4;
}

// BaseImage is the erofs base an erofs guest boots (DECISIONS I-1458):
// three files, each fetched and checked against its own sha256 (lower-case
// hex), so hostd resumes or refetches one file without the others. url is
// the read-only root filesystem (rootfs.erofs, attached as vda);
// kernel_url the kernel (a plain bzImage on x86_64, an uncompressed Image
// on aarch64); initramfs_url the initramfs that mounts vda and vdb and
// switches root. The api picks the files for the host's arch from the
// base_versions row; hostd never chooses. version is the base_versions
// label, [A-Za-z0-9._-]{1,64}, and names hostd's cache directory.
message BaseImage {
  string version = 1;
  string url = 2;
  string sha256 = 3;
  string kernel_version = 4;
  string initramfs_url = 5;
  string initramfs_sha256 = 6;
  string kernel_url = 7;
  string kernel_sha256 = 8;
}
// MenuItem is one element of the project's menu selection
// (config_revisions.menu, docs/interfaces/api.md MenuSelection): exactly
// one of id (a catalog entry, with its options) or package (a Ubuntu
// package name the guest installs with apt-get). DECISIONS I-1458.
message MenuItem {
  string id = 1;
  map<string, string> options = 2;
  string package = 3;
}
// MenuSpec is the project's whole menu, in the order the user chose it,
// for an erofs guest (DECISIONS I-1458). It is a state, not a diff: the
// guest installs what is in it and removes what an earlier spec had and
// this one does not. revision_id is the config revision it comes from.
message MenuSpec {
  repeated MenuItem items = 1;
  string revision_id = 2;
}

message CreateGuest {
  string project_id = 1;
  string guest_id = 2;
  string class = 3;
  uint64 volume_bytes = 4;
  string system_closure = 5;
  repeated Secret secrets = 6;
  map<string, string> env = 7;
  string ssh_ca_pub = 8;
  repeated string principals = 9;
  bytes hooks_config = 10;
  bytes host_key = 11;   // guest sshd ed25519 private key, generated by the api (I-3)
  bytes host_cert = 12;  // its Host-CA certificate
  // DECISIONS I-26: what SetupProject and the snapshot path need.
  string user_id = 13;
  string project_slug = 14;
  string remote_url = 15;
  bytes project_json = 16;
  // The project's whole trigger set (DECISIONS I-1248), as StartGuest
  // carries it.
  repeated Trigger triggers = 17;
  // An erofs guest (DECISIONS I-1458): set with system_closure empty.
  // Both set is invalid_argument; neither is invalid_argument as before.
  BaseImage base_image = 18;
  // The menu the first boot applies (erofs guests only; ignored beside
  // system_closure).
  MenuSpec menu = 19;
}
// StartGuest carries the same delivery fields as CreateGuest (DECISIONS
// I-26) so a host that restarted, and holds nothing on disk, can deliver
// secrets and sshd material again. All are optional; an old-shape
// StartGuest with only guest_id is still accepted.
// class is the project's size class; when set and different from the one
// the guest was created with, hostd boots the guest at this class and
// records it (DECISIONS I-260). Empty keeps the recorded class.
message StartGuest {
  string guest_id = 1;
  repeated Secret secrets = 2;
  map<string, string> env = 3;
  string ssh_ca_pub = 4;
  repeated string principals = 5;
  bytes hooks_config = 6;
  bytes host_key = 7;
  bytes host_cert = 8;
  bytes project_json = 9;
  string class = 10;
  // The project's whole trigger set (DECISIONS I-1248). It rides every
  // start for the same reason the secrets do: hostd keeps none of it,
  // so a guest that lost it comes back with it.
  repeated Trigger triggers = 11;
  // The base this erofs guest boots (DECISIONS I-1458). Different from
  // the recorded one, hostd boots the new base and records it; empty
  // keeps the recorded base, and is what a Nix guest's start sends.
  BaseImage base_image = 12;
  // The project's menu, replayed after the boot when the base changed or
  // the spec differs from the one the guest last applied (erofs only).
  MenuSpec menu = 13;
}
message StopGuest { string guest_id = 1; bool snapshot_first = 2; uint32 timeout_s = 3; }
message DestroyGuest { string guest_id = 1; bool keep_volume = 2; }
message ResizeVolume { string guest_id = 1; uint64 new_bytes = 2; }
// PauseGuest stops a guest's vCPUs and leaves its memory resident on the
// host: every process, socket and open file survives, and the hypervisor,
// virtiofsd, tap and vsock stay up (DECISIONS I-818). reason is a
// lower_snake word for the logs (`idle`, `operator`). hostd answers
// `ok` with a PauseResult that says whether it paused and, when it did
// not, why: a guest with work in flight is a refusal, not a failure.
message PauseGuest { string guest_id = 1; string reason = 2; }
// WakeGuest resumes a paused guest and sets its clock. It is idempotent:
// a guest that is already running is answered `ok` with was_resting
// false, so the api may ask for a wake it does not know it needs
// (DECISIONS I-818).
message WakeGuest { string guest_id = 1; string reason = 2; }
// SetBurst says whether one guest may use cores above the base its class
// sells (DECISIONS I-1128). It is a state the api owns, not an event: the
// api sends allowed=false when the account has used its period's burst
// core-hours with overage off, and allowed=true at the next period or
// when the user raises the limit. The same value twice changes nothing,
// so a resend is harmless and a hostd that never heard from the api
// bursts. hostd stores it and reports it in Hello as
// GuestStatus.burst_denied.
message SetBurst { string guest_id = 1; bool allowed = 2; }
message Build {
  string project_id = 1;
  string revision_id = 2;
  bytes fragment = 3;
  string base_ref = 4;
  Limits limits = 5;
  // The base_versions label the closure is stamped with
  // (/etc/repose/base-version, the NixOS label); empty keeps the
  // flake's own stamp, which under hostd's --override-input is "dirty"
  // (DECISIONS I-118).
  string base_version = 6;
  // The account's personal layer (machine.nix, DECISIONS I-490): a
  // home-manager module hostd writes as personal.nix beside fragment.nix.
  // Empty means none, and the build is exactly what it was before the
  // field existed; a hostd that predates it ignores it.
  bytes personal = 7;
}
// ApplyConfig switches a running Nix guest to system_closure, or applies
// menu inside a running erofs guest (DECISIONS I-1458): exactly one of
// the two; both is invalid_argument. A menu's progress lines arrive as
// BuildLog under this command_id. An erofs guest's base never changes
// here: a new base is a StartGuest's base_image.
message ApplyConfig { string guest_id = 1; string system_closure = 2; bool force_reboot = 3; MenuSpec menu = 4; }
message Snapshot { string guest_id = 1; string reason = 2; }
message Restore {
  string project_id = 1;
  string guest_id = 2;
  string blob_path = 3;
  string class = 4;
  uint64 volume_bytes = 5;
  repeated Secret secrets = 6;
  map<string, string> env = 7;
  string ssh_ca_pub = 8;
  repeated string principals = 9;
  bytes hooks_config = 10;
  bytes host_key = 11;
  bytes host_cert = 12;
  string user_id = 13;
  string project_slug = 14;
  string remote_url = 15;
  bytes project_json = 16;
  string system_closure = 17;  // I-26: the closure to root; empty means the api rebuilds before StartGuest
  string sha256 = 18;  // I-462, I-700: hex SHA-256 of the stored blob; when set, hostd hashes the blob as it writes the volume and fails the restore, removing the volume, on a mismatch
  // I-701: set instead of blob_path, the new volume is a thin clone of
  // another guest's volume on this host, taken at one point in time
  // shared by every sibling of one fork. Only to a host whose Hello names
  // "local_clone".
  RestoreClone clone = 19;
  // The project's whole trigger set (DECISIONS I-1248), as StartGuest
  // carries it: a restored machine comes back with its triggers.
  repeated Trigger triggers = 20;
  // The base the restored erofs guest boots at its next start (DECISIONS
  // I-1458), recorded and fetched ahead; system_closure empty. Both set
  // is invalid_argument.
  BaseImage base_image = 21;
}
// RestoreClone names the volume a Restore copies on the host itself.
// point_id (32 hex digits) names the moment: the first Restore of a fork
// to arrive freezes source_guest_id and takes it, the others clone the
// same one. sibling_guest_ids are every guest of the fork, this one
// included; the point is removed once each of them has finished its
// restore, or after 30 minutes.
message RestoreClone {
  string source_guest_id = 1;
  string point_id = 2;
  repeated string sibling_guest_ids = 3;
}
message UpdateSecrets { string guest_id = 1; repeated Secret secrets = 2; }
message SetPrincipals { string guest_id = 1; repeated string principals = 2; }
message Exec { string guest_id = 1; repeated string argv = 2; uint32 timeout_s = 3; string audit_id = 4; }  // audit_id required (I-26)
message Drain {}
// AnswerQuestion carries the user's reply (or the question's end) to the
// guest whose `repose-ask` is waiting (DECISIONS I-244). hostd forwards it
// to guestd as the request of the same name; not_found means the guest no
// longer knows the question (it rebooted, or the ask was never there).
// status `extended` (DECISIONS I-1242) closes nothing: the owner is
// answering on the dashboard, and expires_unix (unix seconds) is the new
// deadline, which only moves the question's forward. A guestd from before
// it answers invalid_argument, which hostd passes on.
message AnswerQuestion {
  string guest_id = 1;
  string question_id = 2;
  string status = 3;
  string answer = 4;
  int64 expires_unix = 5;
}
// SayToAgent carries a message the owner typed for one of the guest's
// agents (DECISIONS I-1144). hostd relays it to guestd as the request of
// the same name and passes its SayResult back. text is tenant content and
// is never logged. window empty means the guest's single agent window;
// invalid_argument names the windows when there is more than one, and
// not_found is a guest that is not running or has no agent there.
message SayToAgent {
  string guest_id = 1;
  string say_id = 2;
  string window = 3;
  string text = 4;
  string sender = 5;
  bool from_owner = 6;
}

// Trigger is one of a project's triggers (DECISIONS I-1248), relayed to
// guestd whole. The prompt is a PATH in the machine: the api has never
// held its text.
message Trigger {
  string name = 1;
  string kind = 2;            // route|schedule
  string prompt_path = 3;
  string workdir = 4;
  string agent = 5;
  uint32 timeout_s = 6;
  uint32 concurrency = 7;
  string gate = 9;
  string dedupe = 10;         // header:NAME|json:FIELD
  bool enabled = 11;
}
// SetTriggers carries the project's whole set, as UpdateSecrets carries
// the whole named set (DECISIONS I-1248). An empty list removes every
// trigger. hostd keeps none of it: the api re-sends it on every start.
message SetTriggers {
  string guest_id = 1;
  repeated Trigger triggers = 2;
}
// WriteTriggerPrompt writes one trigger's prompt into the machine as dev
// (DECISIONS I-1266), relayed to guestd's request of the same name. The
// dashboard has no SSH; the api carries the text and stores it nowhere.
message WriteTriggerPrompt {
  string guest_id = 1;
  string trigger = 2;
  string workdir = 3;
  string prompt_path = 4;
  bytes text = 5;            // at most 64 KB
}
// RunTrigger runs one now (DECISIONS I-1252, I-1256). The api sends it
// with the run's id as the command_id, so a re-send after a reconnect
// returns the stored result and starts no second agent.
message RunTrigger {
  string guest_id = 1;
  string trigger = 2;
  string run_id = 3;
  string source = 4;          // clock|hand
  string payload_run = 5;
  bool dry_run = 6;
  string payload_path = 7;   // see guestd.proto's RunTrigger
}

message Command {
  string command_id = 1;
  oneof cmd {
    CreateGuest create_guest = 10;
    StartGuest start_guest = 11;
    StopGuest stop_guest = 12;
    DestroyGuest destroy_guest = 13;
    ResizeVolume resize_volume = 14;
    Build build = 15;
    ApplyConfig apply_config = 16;
    Snapshot snapshot = 17;
    Restore restore = 18;
    UpdateSecrets update_secrets = 19;
    SetPrincipals set_principals = 20;
    Exec exec = 21;
    Drain drain = 22;
    AnswerQuestion answer_question = 23;
    PauseGuest pause_guest = 24;
    WakeGuest wake_guest = 25;
    SetBurst set_burst = 26;
    SayToAgent say_to_agent = 27;
    SetTriggers set_triggers = 28;   // DECISIONS I-1248
    RunTrigger run_trigger = 29;     // DECISIONS I-1252
    WriteTriggerPrompt write_trigger_prompt = 30; // DECISIONS I-1266
    DeleteSnapshot delete_snapshot = 31; // DECISIONS I-1636
    RestartHost restart_host = 32; // DECISIONS I-1690
  }
}

// RestartHost parks every running guest, then restarts the machine hostd
// runs on, so the guests come back with their memory when it is up again
// (DECISIONS I-1690; `repose host restart` and the dashboard's Hosts page).
// Only a hostd that names `restart` in Hello.features takes it; any other
// answers invalid_argument. When a guest cannot be parked and force is
// false, the parked ones are restored, nothing restarts, and the result
// says which could not be parked (ok, restarting false). With force the
// host restarts anyway and those guests start fresh.
message RestartHost { bool force = 1; }

// DeleteSnapshot removes one snapshot a host keeps on its own disk (an
// owned host's --snapshot-dir, DECISIONS I-1372, I-1636): the api's
// retention sends it for each expired row whose snapshot lives on that
// host. Idempotent: a snapshot already gone is ok. A host that keeps no
// snapshots (Blob) answers invalid_argument.
message DeleteSnapshot { string blob_path = 1; }

message Error {
  string code = 1;      // see docs/interfaces/grpc-hostd.md
  string message = 2;
  int32 fragment_line = 3;
  // The line in the personal layer (personal.nix, machine.nix to the
  // user) when the error is located there; 0 otherwise (DECISIONS I-490).
  int32 personal_line = 4;
  // The end of the guest's console from a boot that never reached Ready
  // (boot_failed, guest_unresponsive at boot), at most 200 lines and
  // 16 KiB (DECISIONS I-592). Tenant output: the api shows it to the
  // project's owner through `repose logs --kind console` and nobody logs it.
  string console_tail = 5;
}

message Result {
  string command_id = 1;
  bool ok = 2;
  Error error = 3;
  oneof payload {
    CreateResult create = 10;
    StopResult stop = 11;
    BuildResult build = 12;
    ApplyResult apply = 13;
    SnapshotResult snapshot = 14;
    ExecResult exec = 15;
    StartResult start = 16;  // DECISIONS I-590; absent from a hostd before it
    PauseResult pause = 17;  // DECISIONS I-818
    WakeResult wake = 18;    // DECISIONS I-818
    SayResult say = 19;      // DECISIONS I-1144
    TriggerRunResult trigger_run = 20; // DECISIONS I-1256
    RestartResult restart = 21;        // DECISIONS I-1690
  }
}
// RestartResult is RestartHost's answer, sent before the machine goes
// down: parked is how many guests are saved (parked now or before),
// not_parked the guest ids that could not be, restarting whether the
// restart was asked for, and park_ms how long the park took.
message RestartResult { uint32 parked = 1; repeated string not_parked = 2; bool restarting = 3; uint32 park_ms = 4; }
// BootTimings is where one boot's time went, in milliseconds (DECISIONS
// I-707): volume (create only: the thin volume and its filesystem),
// prepare (the hypervisor's argv, the network and virtiofsd), ready (the
// hypervisor started to guestd's Ready), paths (RegisterPaths), setup
// (secrets, principals and SetupProject), total (all of it).
message BootTimings { uint32 volume_ms = 1; uint32 prepare_ms = 2; uint32 ready_ms = 3; uint32 paths_ms = 4; uint32 setup_ms = 5; uint32 total_ms = 6; }
// menu_error (DECISIONS I-1458) is set when the guest booted and the
// first boot's menu did not apply: the guest runs, and the error is the
// ApplyMenu's code (menu_failed, invalid_argument) and last line.
message CreateResult { string guest_ip = 1; uint32 vsock_cid = 2; BootTimings boot = 3; Error menu_error = 4; }
// base_version (I-1458): the erofs base the guest ran when the snapshot
// was taken; empty for a Nix guest, and accepted empty for one release.
// blob_path, bytes and sha256 when snapshot_first (I-26, I-462).
// snapshot_error is set when the guest stopped and its snapshot could not
// be written (`<code>: <message>`, hostd's words; DECISIONS I-1636): the
// stop is ok, the guest is stopped with its volume intact, and there is no
// blob. Empty from a hostd before it, which failed the whole stop instead.
message StopResult { string snapshot_id = 1; string blob_path = 2; uint64 bytes = 3; string sha256 = 4; string base_version = 5; string snapshot_error = 6; }
message BuildResult { string system_closure = 1; uint64 closure_bytes = 2; bool kernel_changed = 3; }
message ApplyResult { bool rebooted = 1; bool reboot_required = 2; }
// StartResult says which system a started guest runs. failed_closure is
// set when the boot of the guest's recorded closure never reached Ready
// and hostd booted booted_closure, the last one that did, instead
// (DECISIONS I-590); boot_error is then why that boot failed.
// guest_ip and vsock_cid are the started guest's address, so a start
// after a create that failed past the guest's own boot gives the api the
// address that create never reported (DECISIONS I-720); empty and 0 from
// a hostd that predates them, which the api reads as "unchanged".
message StartResult {
  string booted_closure = 1;
  string failed_closure = 2;
  Error boot_error = 3;
  BootTimings boot = 4;  // the boot that reached running (I-707)
  string guest_ip = 5;
  uint32 vsock_cid = 6;
  // The erofs base the started guest booted (DECISIONS I-1458); empty for
  // a Nix guest and from an older hostd.
  string booted_base_version = 7;
  // As CreateResult.menu_error: the guest runs, its menu replay failed.
  Error menu_error = 8;
}
message SnapshotResult { string snapshot_id = 1; string blob_path = 2; uint64 bytes = 3; string sha256 = 4; string base_version = 5; }  // sha256: hex SHA-256 of the uploaded blob (I-462); base_version as StopResult's (I-1458)
// PauseResult answers a PauseGuest. paused is false with why_not set
// when the guest was not paused for a reason that is not a failure: it
// has a command in flight, it is already paused, the host is going down,
// or a user timer is due within the hold (DECISIONS I-818). why_not is a
// lower_snake word, never a sentence.
message PauseResult { bool paused = 1; string why_not = 2; int64 at = 3; }
// WakeResult answers a WakeGuest: was_resting says whether this call is
// what resumed the guest, and wake_ms how long from the resume to
// guestd's answer (DECISIONS I-818).
message WakeResult { bool was_resting = 1; uint32 wake_ms = 2; }
message ExecResult { int32 exit_code = 1; bytes stdout = 2; bytes stderr = 3; }
// SayResult is guestd's answer to a SayToAgent (DECISIONS I-1144): state
// delivered or waiting, the window it went to, and whether it replaced a
// message that was still waiting there.
message SayResult { string state = 1; string window = 2; bool replaced = 3; }

message BuildLog { string command_id = 1; uint64 seq = 2; string line = 3; }

// tmux_window: a tmux window name or a herdr agent key, at most 64 bytes
// (DECISIONS I-504).
// AgentProc is one running agent (DECISIONS I-1676). agent_id is the
// agent's process as "pid:starttime", or, where guestd knows no process
// (a herdr pane), the terminal; an older guestd sends none and the api
// derives "tmux:<tmux_window>". tmux_window is the tmux window name or
// herdr agent key, empty for an agent with no terminal. terminal is
// "tmux:<window>", "herdr:<key>" or empty.
message AgentProc {
  string agent = 1;
  string tmux_window = 2;
  string state = 3;
  string agent_id = 4;
  string terminal = 5;
}
message ProcSample { string comm = 1; uint64 cpu_ns_delta = 2; uint64 rss_bytes = 3; }
message GuestSignals {
  uint32 ssh_sessions = 1;
  // tmux clients only; 0 on a herdr machine, whose clients count in
  // ssh_sessions (DECISIONS I-511).
  uint32 tmux_clients = 2;
  repeated AgentProc agents = 3;
  uint32 docker_containers = 4;
  bool guestd_ok = 5;
  // Unix seconds of the last activity of a tmux client of the project's
  // session: when somebody last typed in the guest (DECISIONS I-1272).
  // 0 when no client has ever been seen, when tmux is down, and from a
  // guestd from before I-1272; the notification hold reads the session
  // counts above in that case.
  uint64 last_input_unix = 6;
}
message GuestSample {
  string guest_id = 1;
  string state = 2;
  string class = 3;
  uint64 cpu_ns_delta = 4;
  uint64 mem_rss_bytes = 5;
  uint64 net_tx_bytes_delta = 6;
  uint64 net_rx_bytes_delta = 7;
  uint64 disk_alloc_bytes = 8;
  uint64 disk_used_bytes = 9;
  GuestSignals signals = 10;
  repeated ProcSample procs = 11;
  // Microseconds since the last sample in which a task inside the guest
  // was runnable and waited for a vCPU: the guest's /proc/pressure/cpu
  // "some" total, moved on by hostd (DECISIONS I-493).
  uint64 cpu_pressure_us_delta = 12;
  // Microseconds since the last sample in which a thread of the guest's
  // hypervisor unit was runnable and waited for a host CPU: the unit
  // cgroup's cpu.pressure "some" total on the host, the guest's steal
  // (DECISIONS I-493).
  uint64 host_cpu_wait_us_delta = 13;
  // Memory in use as the guest sees it, MemTotal less MemAvailable, at the
  // sample (guest-written; mem_rss_bytes is what the host has backed,
  // which never shrinks without a balloon). DECISIONS I-493.
  uint64 guest_mem_used_bytes = 14;
  // The guest's root filesystem, used and size in bytes, as statfs in the
  // guest sees it (guest-written; 0 for both when the guest did not say or
  // said something past the volume). disk_used_bytes is the thin volume's
  // allocated blocks, which keep a deleted file's blocks until the guest's
  // fstrim (daily, and at every stop: I-585). DECISIONS I-567.
  uint64 root_used_bytes = 15;
  uint64 root_size_bytes = 16;
  // The guest is paused (DECISIONS I-818). `state` stays `running`, since
  // that is what bills the minute; the guest-written signals are the last
  // ones read before the pause and `guestd_ok` stays true, because guestd
  // is paused with its guest and not lost. cpu_ns_delta and the net
  // deltas are the host's own counters and read about zero. False from a
  // hostd older than I-818.
  bool resting = 17;
  // Bytes the guest sent to the internet since the last sample: its nft
  // egress counter, which never sees what it sends the edge (SSH, port
  // forwards, hooks, the browser view) or the host's caches. This is the
  // egress the plan bills. net_tx_bytes_delta stays everything the guest
  // sent through its tap, which the idle rule and the abuse checks read.
  // Absent from a hostd older than DECISIONS I-1063, where billing falls
  // back to net_tx_bytes_delta.
  optional uint64 net_egress_bytes_delta = 18;
  // Nanoseconds of CPU time this guest used above the base share its
  // class sells, since the last sample: the burst controller's
  // per-second sum of max(0, used - base x dt) over the minute
  // (DECISIONS I-1126, I-1128). Counted each second rather than from the
  // minute's average, which undercounts a guest that bursts in spurts.
  // Absent from a hostd older than this and from a host without the
  // `burst` feature, which the api reads as no burst.
  optional uint64 burst_cpu_ns_delta = 19;
  // The cap the controller has this guest at now, in thousandths of a
  // core: its base when the gate is shut, up to its class ceiling when
  // the host is quiet. 0 when the host runs no controller.
  uint32 burst_cap_millicores = 20;
  // When this guest was parked, unix seconds, while it waits for its
  // host's user to log in before it can be restored; 0 when it is not
  // waiting (DECISIONS I-1672). Only hostd on a Mac without the appliance
  // sets it: Virtualization.framework restores a save file only in the
  // user's unlocked session (I-1662). Its memory is kept; the guest runs
  // again at the login. 0 from every other hostd, which the api reads as
  // "not waiting".
  int64 parked_waiting_since = 21;
}
message HostSample { uint64 mem_free = 1; uint64 pool_free = 2; double load1 = 3; uint32 builds_running = 4; }
message Samples { int64 ts = 1; repeated GuestSample guests = 2; HostSample host = 3; }

message GuestStateChanged { string guest_id = 1; string state = 2; string reason = 3; }
message AgentEvent {
  string guest_id = 1;
  string agent = 2;
  string kind = 3;
  string summary = 4;
  // The tmux window the hook came from, as guestd resolved it (the
  // `window` of 13-notifications.md §5.1); empty when unknown. I-121.
  // A tmux window name or a herdr agent key, at most 64 bytes (I-504).
  string tmux_window = 5;
  // The link a `repose-notify --link URL --label TEXT` attached
  // (DECISIONS I-931), as internal/msglink checked it; tenant content.
  string link_url = 6;
  string link_label = 7;
  // The agent the hook came from, as AgentProc.agent_id (I-1676); empty
  // from an older guestd.
  string agent_id = 8;
}
// AgentQuestion is a guest's Question notify, relayed (DECISIONS I-244).
// The text is tenant content: delivered to the user's channels, never
// logged.
message AgentQuestion {
  string guest_id = 1;
  string question_id = 2;
  string agent = 3;
  // A tmux window name or a herdr agent key, at most 64 bytes (I-504).
  string tmux_window = 4;
  string text = 5;
  repeated string options = 6;
  uint32 timeout_s = 7;
  string state = 8;
  // Why a guest-side close happened: terminal|withdrawn|interrupted|asker_gone
  // (I-690). Empty on an open and from older hosts.
  string reason = 9;
  // The named secret the question asks for (DECISIONS I-929); empty for
  // a question that takes a written answer.
  string secret = 10;
  // The `--link URL --label TEXT` of the ask (DECISIONS I-931).
  string link_url = 11;
  string link_label = 12;
}
// GuestResting is a guest paused or woken (DECISIONS I-818), so the api
// shows the marker within seconds rather than at the next minute's
// sample. It is NOT a GuestStateChanged: the guest's state does not
// change, and a state change cancels the project's open questions.
message GuestResting { string guest_id = 1; bool resting = 2; int64 at = 3; string reason = 4; }
message SnapshotDone { string guest_id = 1; string snapshot_id = 2; string blob_path = 3; uint64 bytes = 4; string sha256 = 5; string base_version = 6; }  // base_version as StopResult's (I-1458)
message HostWarning { string kind = 1; string detail = 2; }
// An operator's SSH login to the host, from the PAM hook that runs
// `hostd audit-login`: what the api turns into the audit_log row 14 §5
// requires (DECISIONS I-140). Carries the certificate's key id and serial
// and a key fingerprint, never a key or certificate body, and never the
// source address.
message OperatorLogin {
  string pam_type = 1;        // open_session|close_session
  bool user_present = 2;
  string key_id = 3;          // certificate key_id (operator:<name>), empty for a plain key
  uint64 serial = 4;          // certificate serial, 0 for a plain key
  string key_fingerprint = 5; // SHA256:... of the key (the bootstrap key when key_id is empty)
}
// TriggerRunResult is guestd's answer to a RunTrigger, relayed: state
// working, skipped or failed, with the window and the bounded reason.
message TriggerRunResult { string state = 1; string window = 2; string reason = 3; }
// TriggerRunEvent is a guest's TriggerRun notify, relayed (DECISIONS
// I-1256). summary is the agent's own `--done` words and reason may be a
// gate's last stderr line: both tenant content, shown to the owner and
// never logged. dedupe_key is a provider's own event id and is kept on
// the run row for the same reason.
message TriggerRunEvent {
  string guest_id = 1;
  string run_id = 2;
  string trigger = 3;
  string state = 4;           // working|done|failed|timeout|skipped
  string reason = 5;
  string summary = 6;
  string link_url = 7;
  string link_label = 8;
  string window = 9;
  int64 started_unix = 10;
  int64 finished_unix = 11;
  string dedupe_key = 12;
  uint64 payload_bytes = 13;
  // 14 was payload_kept; the api derives it (I-1262).
  reserved 14;
  string source = 15;         // route|clock|hand
}
message Event {
  string event_id = 1;
  int64 ts = 2;
  oneof ev {
    GuestStateChanged guest_state_changed = 10;
    AgentEvent agent_event = 11;
    SnapshotDone snapshot_done = 12;
    HostWarning host_warning = 13;
    OperatorLogin operator_login = 14;
    AgentQuestion agent_question = 15;
    GuestResting guest_resting = 16;
    TriggerRunEvent trigger_run = 17;  // DECISIONS I-1256
  }
}
